name: quicksat
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.12
  - astropy
  # static plots: the scenario's Gantt chart and ground track maps
  - matplotlib
  - numpy
  - pandas
  # time intervals: eclipses and activities are both portion intervals
  - portion
  - pydantic >=2.0
  - pyyaml
  # rotations and quaternions: the attitudes and slews
  - scipy
  # SGP4 propagation of a TLE
  - sgp4
  # pandas Styler needs it; conda was getting it via jupyterlab by accident
  - jinja2
  # packages needed for testing and automation
  - pytest
  - pytest-xdist
  - coverage
  # packages needed for the sample notebooks
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - tox
