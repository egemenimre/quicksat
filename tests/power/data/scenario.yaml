# Fixture for the power tests with a 3D model: the power sample's model, whose
# wings turn and park in imaging, over one orbit. Change it only together with
# the tests that read it.
orbit:
  tle_file: sso_510km.tle
start: 2026-10-01T09:00:00
duration: 1 orbit
step: 10 s
3d_model:
  file: spacecraft.glb
  articulations:
    wing +y: {part: Wing +y, axis: +y, point: [-z, sun], park: {imaging: 0 deg}}
    wing -y: {part: Wing -y, axis: +y, point: [-z, sun], park: {imaging: 0 deg}}
attitudes:
  nadir: {point: [+z, nadir], constrain: [-y, orbit normal]}
  sun pointing: {point: [-z, sun], constrain: [-y, orbit normal]}
activities:
  - [power generation, 20 min, sun pointing, idle]
  - [imaging, 10 min, nadir, imaging]
  - [nadir to the eclipse exit, eclipse exit, nadir, idle]
