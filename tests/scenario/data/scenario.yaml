# read it. Every trigger kind appears once, and every status is ok except the
# last activity's, which is cut at the end.
orbit:
  tle_file: sso_510km.tle
start: 2026-10-01T00:00:00
duration: 3 orbits
step: 10 s
attitudes:
  nadir: {point: [+z, nadir], constrain: [-y, orbit normal]}
  sun pointing: {point: [-z, sun], constrain: [-y, orbit normal]}
activities:
  - [to the node, ascending node, nadir, {payload_mode: idle, platform_mode: idle}]
  - [to 45 deg, latitude 45 deg ascending, nadir, {payload_mode: idle, platform_mode: idle}]
  - [before the eclipse, eclipse entry - 1 min, sun pointing, {payload_mode: idle, platform_mode: idle}, sunlit]
  - [last minute, eclipse entry, nadir, {payload_mode: idle, platform_mode: idle}, sunlit]
  - [eclipse, eclipse exit, nadir, {payload_mode: idle, platform_mode: idle}, eclipse]
  - [imaging, latitude 45 deg + 4 min, sun pointing, {payload_mode: imaging, platform_mode: imaging}, sunlit]
  - [to the descending node, descending node - 30 s, sun pointing, {payload_mode: idle, platform_mode: idle}]
  - [downlink, 10 min, nadir, {payload_mode: downlink, platform_mode: downlink}]
