# Fixture for the scenario tests: a list in which each problem happens once.
#
# 1. ends a minute before the eclipse, so 2 starts in sunlight and is outside its
#    eclipse constraint by 60 s.
# 3. ends 100 min before the next eclipse entry, before it starts: a negative
#    duration.
# 5. waits for a latitude the orbit never reaches: the event never came.
orbit:
  tle_file: sso_510km.tle
start: 2026-10-01T00:00:00
duration: 2 orbits
step: 10 s
attitudes:
  nadir: {point: [+z, nadir], constrain: [-y, orbit normal]}
  sun pointing: {point: [-z, sun], constrain: [-y, orbit normal]}
activities:
  - [too early, eclipse entry - 1 min, sun pointing, {payload_mode: idle, platform_mode: idle}, sunlit]
  - [outside, eclipse exit, nadir, {payload_mode: idle, platform_mode: idle}, eclipse]
  - [negative, eclipse entry - 100 min, nadir, {payload_mode: idle, platform_mode: idle}]
  - [fixed time, 30 min, sun pointing, {payload_mode: idle, platform_mode: idle}, sunlit]
  - [never comes, latitude 85 deg, nadir, {payload_mode: idle, platform_mode: idle}]
