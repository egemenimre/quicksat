# Payload dataflow model: what the instrument generates, what the downlink clears,
# and what has to be held on board in between.
#
# Orbit comes from mission.yaml.

generation:
  # Before compression: 416.67 Mbit/s after it.
  raw_datarate: 1000 Mbit/s
  compression_ratio: 2.4
  # Of each orbit: daytime, full VNIR.
  duty_cycle: 5 %

downlink:
  # The X-band transmitter's throughput.
  rate: 800 Mbit/s
  # Usable ground contacts, from Mission Analysis.
  contacts_per_day: 7
  # The average usable contact.
  avg_contact_duration: 6 min

storage:
  # The sizing case for the mass memory.
  orbits_without_contact: 3
