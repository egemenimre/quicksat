# Delta-V budget settings.
#
# Orbit and duration both come from mission.yaml: the manoeuvres are flown from the
# orbit and the recurring ones are scaled by the duration, and the delta-V budget is
# not the only thing that needs either. What stays here is what only it can use.

propulsion:
  # Hydrazine monopropellant, for the rocket equation.
  isp: 220 s

# Percent, one allowance on the total.
margin: 5

collision_avoidance:
  # A hop up and back down. False when the satellite was due to be raised
  # anyway, and the manoeuvre does double duty against the maintenance debt.
  return_burn: false
