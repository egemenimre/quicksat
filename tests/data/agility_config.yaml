# Attitude agility settings: the spacecraft cases that can be slewed, the wheels
# that slew them, and how long the platform takes to settle afterwards.
#
# No mass anywhere. The mass budget owns it, and a second copy here would drift --
# the same reason altitude lives only in mission.yaml. Orbit comes from mission.yaml,
# for ground track speed. The target duration for a manoeuvre is not here
# either: that is asked of a spacecraft, not a property of one.

inertia_cases:
  # One case is one spacecraft, one set of mass properties. The names are yours
  # -- nothing in the code matches on them. Each case is EITHER an envelope
  # estimate OR a stated inertia, never both, so there is never a question which
  # of the two produced a number.

  first_guess:               # inertia estimated from a uniform box
    body:
      x: 1.5 m               # along track
      y: 1.5 m               # cross track
      z: 2.0 m               # nadir
    appendage_factor:        # uplift for arrays, radiator, booms; per axis,
      roll: 1.07             # because the appendages are not symmetric
      pitch: 1.02            # same modifier for pitch
    propellant: 100 %        # of the load still aboard. The mass comes from the
                             # mass budget and this picks the mission point, so
                             # the inertia follows the mass automatically.

  measured_bol:              # stated outright, as a mass properties report gives it
    inertia:
      roll: 264.7 kg*m**2    # NOTE: a stated inertia is a fixed number. It does
      pitch: 280.0 kg*m**2   # not follow the mass budget, and nothing checks that
                             # it still describes the spacecraft you costed.

  measured_eol:              # the same spacecraft, tanks empty
    inertia:
      roll: 250.0 kg*m**2
      pitch: 264.0 kg*m**2

wheels:
  count: 4                   # pyramid, symmetry axis along yaw
  elevation: 26.5 deg        # of each wheel above the pyramid base plane
  momentum: 4.0 N*m*s        # nameplate, per wheel
  torque: 0.2 N*m            # nameplate, per wheel
  momentum_use_factor: 33.3 %   # policy: the rest is disturbance storage
  torque_derating: 75 %         # policy: the rest is control authority

settling_time: 20 s          # what the platform needs after a slew before the
                             # payload can work. An ADCS property, applied once
                             # at the end of a manoeuvre and not between steps.
