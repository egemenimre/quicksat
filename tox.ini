# This is the setup file for the tox tool
[tox]
description = tox environments list
envlist =
    py311
    py312
    py313
    py314
    quicktest
    clean_coverage
    coverage
    reformat
    codestyle

# skips packaging
skipsdist = True

# Switch to conda based (rather than pip based) environment
requires = tox-conda

[testenv]
description = run tests

allowlist_externals=
    /bin/bash
    /usr/bin/bash

deps =
    pytest
    pytest-xdist

conda_env = environment.yml
conda_install_args=
    --override-channels

commands =
    pytest {posargs:-vv --durations=0 --junitxml=test-results/test_output.xml}

[testenv:quicktest]
description = quick testing
deps =
    pytest
    pytest-xdist
commands =
    pytest {posargs:-v -n=auto}

[testenv:coverage]
description = checks coverage
deps =
    pytest
    coverage
skip_install = true
commands =
    coverage run --source quicksat -m pytest
    coverage xml
    coverage report -m

[testenv:clean_coverage]
deps = coverage
skip_install = true
commands = coverage erase

[testenv:reformat]
description = reformats the code using ruff
deps =
    ruff
skip_install = true
commands =
    ruff check --fix quicksat tests
    ruff format quicksat tests

[testenv:codestyle]
description = checks code style using ruff
deps =
    ruff
skip_install = true
commands =
    ruff check quicksat tests
    ruff format --check quicksat tests
