# This is the setup file for the tox tool
[tox]
description = tox environments list
envlist =
    py311
    py312
    py313
    py314
    quicktest
    clean_coverage
    coverage
    reformat
    codestyle

# tox 3 would need isolated_build set to honour the flit backend, and is end of life, so
# state the floor rather than letting it fail on a PEP 517 message. Note that an env
# where tox-conda pinned tox below 4 cannot provision its way out of this -- the plugin
# intercepts the provision env and dies on conda_exe -- so uninstall tox-conda there.
requires = tox>=4

# an absent interpreter skips rather than fails, so a bare tox run works with only one
# version installed -- CircleCI is what covers the whole matrix
skip_missing_interpreters = True

[testenv]
description = run tests

# the test extra carries pytest, pytest-xdist and coverage, and installing the package
# brings its runtime dependencies along -- which is what conda_env used to do here
extras = test

commands =
    pytest {posargs:-vv --durations=0 --junitxml=test-results/test_output.xml}

[testenv:quicktest]
description = quick testing
extras = test
commands =
    pytest {posargs:-v -n=auto}

[testenv:coverage]
description = checks coverage
# no skip_install here: this env runs the suite, so it needs the package and its
# dependencies -- the linting envs below are the ones that can go without
extras = test
commands =
    coverage run --source quicksat -m pytest
    coverage xml
    coverage report -m

[testenv:clean_coverage]
deps = coverage
skip_install = true
commands = coverage erase

[testenv:reformat]
description = reformats the code using ruff
deps =
    ruff
skip_install = true
commands =
    ; notebooks are linted but not formatted: the linter orders their imports and drops
    ; unused ones, while the formatter would wrap their aligned print blocks at 88
    ; without bringing the f-strings under it anyway
    ruff check --fix quicksat tests sample docs
    ruff format quicksat tests

[testenv:codestyle]
description = checks code style using ruff and vulture
deps =
    ruff
    vulture
skip_install = true
commands =
    ; the same targets as the reformat env, so that it checks exactly what that fixes:
    ; notebooks are linted but not formatted
    ruff check quicksat tests sample docs
    ruff format --check quicksat tests
    ; tests are scanned alongside the package so that they count as usage --
    ; scanning the package alone flags every public method as dead
    vulture quicksat tests --ignore-names model_config --ignore-decorators "@field_validator,@model_validator"
