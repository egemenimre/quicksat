# The scenario of the scenario reference notebook, docs/scenario/scenario_ref.ipynb.
#
# The notebook quotes figures from this run, so this file changes only with it.
# The worked example has its own copy, in sample/scenario/data/.

orbit:
  # A 510 km sun-synchronous orbit at 10:30 LTAN, with its epoch at the start
  tle_file: sso_510km.tle

start: 2026-10-01T00:00:00
duration: 3 orbits
step: 10 s

# The spacecraft's 3D model, which the viewer draws, in body axes and metres, and
# the wings that turn to face the sun, parked while the platform is in imaging
3d_model:
  file: spacecraft.glb
  articulations:
    wing +y: {part: Wing +y, axis: +y, point: [-z, sun], park: {imaging: 0 deg}}
    wing -y: {part: Wing -y, axis: +y, point: [-z, sun], park: {imaging: 0 deg}}

attitudes:
  nadir: {point: [+z, nadir], constrain: [-y, orbit normal]}
  sun pointing: {point: [-z, sun], constrain: [-y, orbit normal]}

activities:
  - [power generation, eclipse entry, sun pointing, {payload_mode: idle, platform_mode: idle}, sunlit]
  - [eclipse in nadir, eclipse exit, nadir, {payload_mode: idle, platform_mode: idle}, eclipse]
  - [power generation, latitude 45 deg - 2 min, sun pointing, {payload_mode: idle, platform_mode: idle}, sunlit]
  - [imaging 45 deg lat, latitude 45 deg + 4 min, nadir, {payload_mode: imaging, platform_mode: imaging}, sunlit]
  - [downlink, 10 min, nadir, {payload_mode: downlink, platform_mode: ttc}]
