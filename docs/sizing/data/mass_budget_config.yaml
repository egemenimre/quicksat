# quicksat mass budget configuration
#
# Everything is keyed on location: it carries both the system margin and the
# harness parameters. `Launcher` is a reserved location name and needs no entry --
# it defaults to no margins, no harness, and being dropped at separation.

locations:
  # All three figures are percentages. The system margin applies to the
  # location's subtotal. The harness is a share of the location's equipment
  # mass, before margin, and takes its own contingency.
  Platform:
    system_margin: 20
    harness_fraction: 4
    harness_margin: 25
  Payload:
    system_margin: 20
    harness_fraction: 5
    harness_margin: 25
