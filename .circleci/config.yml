# Python CircleCI 2.1 configuration file
version: 2.1

jobs:

  codecov-coverage-report:

    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ".[test]"
      - run:
          name: Generate coverage data
          command: |
            coverage run --source quicksat -m pytest
            coverage xml
            coverage report -m
      # The upload calls the Codecov CLI directly rather than going through the codecov
      # orb. The orb downloads a signed binary from cli.codecov.io and verifies it with
      # gpg; on CircleCI that key fetch came back empty, so gpg exited 2 and failed the
      # job. Its use_pypi parameter is supposed to install from pip and skip the check
      # instead, but 5.4.3 ignored it and downloaded the binary regardless. Two plain
      # commands have none of those moving parts, and pip is already here.
      #
      # CODECOV_TOKEN comes from the project's environment variables -- the CLI picks it
      # up on its own. -Z makes a failed upload fail the job rather than pass quietly.
      - run:
          name: Upload coverage to Codecov
          command: |
            pip install codecov-cli
            codecovcli upload-coverage --fail-on-error --disable-search --file coverage.xml


  tests:

    parameters:
      python-version:
        type: string

    docker:
      - image: cimg/python:<< parameters.python-version >>

    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ".[test]"
      - run:
          name: Run tests
          command: pytest -vv --durations=0 --junitxml=test-results/test_output.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results


  codestyle:

    docker:
      - image: cimg/python:3.13

    steps:
      - checkout
      - run:
          name: Install the linters
          command: pip install ruff vulture
      # these mirror the [testenv:codestyle] commands in tox.ini -- keep the two in
      # step. tox itself is not used here: it would pull in conda, which the cimg
      # images do not carry.
      - run:
          name: Make sure style checks pass
          command: |
            ruff check quicksat tests sample docs
            ruff format --check quicksat tests
            vulture quicksat tests --ignore-names model_config,daemon_threads,allow_reuse_address,log_message,do_GET,do_POST --ignore-decorators "@field_validator,@model_validator"

  javascript:

    docker:
      - image: cimg/node:24.21

    steps:
      - checkout
      # Node's own test runner, so there is nothing to install. Node expands the
      # quoted pattern itself.
      - run:
          name: Test the viewer's and the editor's logic
          command: node --test "tests/**/*.test.js"


  # Uploads the package to PyPI, for a version tag only: see the release workflow.
  # It builds from this clean checkout, so no file that git ignores can reach the
  # package. PYPI_API_TOKEN comes from the pypi context, as a token scoped to the
  # quicksat project.
  release:

    docker:
      - image: cimg/python:3.13

    steps:
      - checkout
      - run:
          name: Check the tag against the version and the changelog
          command: |
            version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' quicksat/__init__.py)
            if [ "v$version" != "$CIRCLE_TAG" ]; then
              echo "The tag $CIRCLE_TAG does not match __version__ $version"
              exit 1
            fi
            if ! grep -q "^## \[$version\]" CHANGELOG.md; then
              echo "CHANGELOG.md has no section for $version"
              exit 1
            fi
      - run:
          name: Build the package
          command: |
            pip install build twine
            python -m build
            twine check --strict dist/*
      - store_artifacts:
          path: dist
      - run:
          name: Upload to PyPI
          command: TWINE_PASSWORD="$PYPI_API_TOKEN" twine upload --non-interactive dist/*
          environment:
            TWINE_USERNAME: __token__


workflows:
  tests_and_codestyle:
    jobs:
      - codestyle
      - javascript
      - tests:
          matrix:
            parameters:
              python-version: ["3.12", "3.13", "3.14"]
  coverage:
    jobs:
      - codecov-coverage-report
  # Runs only for a version tag, such as v0.2.0, and never for a branch, so a push
  # releases nothing. Pushing the tag starts it: the checks run again, and the
  # upload waits for all of them.
  release:
    jobs:
      - codestyle: &on-version-tag
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - javascript: *on-version-tag
      - tests:
          <<: *on-version-tag
          matrix:
            parameters:
              python-version: ["3.12", "3.13", "3.14"]
      - release:
          <<: *on-version-tag
          context: pypi
          requires:
            - codestyle
            - javascript
            - tests
