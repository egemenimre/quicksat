# Python CircleCI 2.1 configuration file
version: 2.1

orbs:
  codecov: codecov/codecov@5.4.3

jobs:

  codecov-coverage-report:

    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ".[test]"
      - run:
          name: Generate coverage data
          command: |
            coverage run --source quicksat -m pytest
            coverage xml
            coverage report -m
      # use_pypi installs the uploader with pip instead of fetching the binary from
      # cli.codecov.io. That download imports Codecov's PGP key first, and when the key
      # fetch comes back empty gpg exits 2 and takes the job with it. pip is already
      # here, so this keeps a verified channel rather than passing skip_validation and
      # turning the check off altogether.
      - codecov/upload:
          files: coverage.xml
          use_pypi: true


  tests:

    parameters:
      python-version:
        type: string

    docker:
      - image: cimg/python:<< parameters.python-version >>

    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ".[test]"
      - run:
          name: Run tests
          command: pytest -vv --durations=0 --junitxml=test-results/test_output.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results


  codestyle:

    docker:
      - image: cimg/python:3.13

    steps:
      - checkout
      - run:
          name: Install the linters
          command: pip install ruff vulture
      # these mirror the [testenv:codestyle] commands in tox.ini -- keep the two in
      # step. tox itself is not used here: it would pull in conda, which the cimg
      # images do not carry.
      - run:
          name: Make sure style checks pass
          command: |
            ruff check quicksat tests sample docs
            ruff format --check quicksat tests
            vulture quicksat tests --ignore-names model_config --ignore-decorators "@field_validator,@model_validator"


workflows:
  tests_and_codestyle:
    jobs:
      - codestyle
      - tests:
          matrix:
            parameters:
              python-version: ["3.11", "3.12", "3.13", "3.14"]
  coverage:
    jobs:
      - codecov-coverage-report
