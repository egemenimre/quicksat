# Python CircleCI 2.1 configuration file
version: 2.1

jobs:

  codecov-coverage-report:

    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ".[test]"
      - run:
          name: Generate coverage data
          command: |
            coverage run --source quicksat -m pytest
            coverage xml
            coverage report -m
      # The upload calls the Codecov CLI directly rather than going through the codecov
      # orb. The orb downloads a signed binary from cli.codecov.io and verifies it with
      # gpg; on CircleCI that key fetch came back empty, so gpg exited 2 and failed the
      # job. Its use_pypi parameter is supposed to install from pip and skip the check
      # instead, but 5.4.3 ignored it and downloaded the binary regardless. Two plain
      # commands have none of those moving parts, and pip is already here.
      #
      # CODECOV_TOKEN comes from the project's environment variables -- the CLI picks it
      # up on its own. -Z makes a failed upload fail the job rather than pass quietly.
      - run:
          name: Upload coverage to Codecov
          command: |
            pip install codecov-cli
            codecovcli upload-coverage --fail-on-error --disable-search --file coverage.xml


  tests:

    parameters:
      python-version:
        type: string

    docker:
      - image: cimg/python:<< parameters.python-version >>

    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install ".[test]"
      - run:
          name: Run tests
          command: pytest -vv --durations=0 --junitxml=test-results/test_output.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results


  codestyle:

    docker:
      - image: cimg/python:3.13

    steps:
      - checkout
      - run:
          name: Install the linters
          command: pip install ruff vulture
      # these mirror the [testenv:codestyle] commands in tox.ini -- keep the two in
      # step. tox itself is not used here: it would pull in conda, which the cimg
      # images do not carry.
      - run:
          name: Make sure style checks pass
          command: |
            ruff check quicksat tests sample docs
            ruff format --check quicksat tests
            vulture quicksat tests --ignore-names model_config --ignore-decorators "@field_validator,@model_validator"


workflows:
  tests_and_codestyle:
    jobs:
      - codestyle
      - tests:
          matrix:
            parameters:
              python-version: ["3.11", "3.12", "3.13", "3.14"]
  coverage:
    jobs:
      - codecov-coverage-report
