/** A new envelope case, or the envelope half of a case that states its inertia. */
const envelope = () => ({ body: { x: q("", "m"), y: q("", "m"), z: q("", "m") }, appendage_factor: { roll: 1, pitch: 1 }, propellant: q(100, "%") });

function readAgility(file) {
  const m = mapOf(file && file.data);
  if (file) known(file.name, m, ["inertia_cases", "wheels", "settling_time"]);
  const cases = mapOf(m.inertia_cases);
  const w = mapOf(m.wheels);
  if (file) known(`${file.name} › wheels`, w, ["count", "elevation", "momentum", "torque", "momentum_use_factor", "torque_derating"]);
  return {
    comments: textOf(m.comments),
    cases: {
      comments: textOf(cases.comments),
      items: Object.entries(cases).filter(([name]) => name !== RESERVED).map(([name, value]) => {
        const c = mapOf(value);
        const where = `inertia_cases › ${name}`;
        known(`${file.name} › ${where}`, c, ["body", "appendage_factor", "propellant", "inertia"]);
        const item = { name, kind: c.inertia ? "stated" : "envelope", ...envelope(), inertia: { roll: q("", "kg*m**2"), pitch: q("", "kg*m**2") }, comments: textOf(c.comments) };
        if (c.inertia && (c.body || c.appendage_factor)) notice("changed", `${where} states an inertia and also has an envelope: the editor keeps the stated inertia`);
        if (c.inertia) {
          const i = mapOf(c.inertia);
          item.inertia = { roll: readQ(i.roll, "kg*m**2", `${where} › roll`), pitch: readQ(i.pitch, "kg*m**2", `${where} › pitch`) };
        }
        const b = mapOf(c.body), f = mapOf(c.appendage_factor);
        if (c.body) item.body = { x: readQ(b.x, "m", `${where} › x`), y: readQ(b.y, "m", `${where} › y`), z: readQ(b.z, "m", `${where} › z`) };
        if (c.appendage_factor) item.appendage_factor = { roll: readNum(f.roll, `${where} › roll`), pitch: readNum(f.pitch, `${where} › pitch`) };
        if (c.propellant != null) item.propellant = readPercent(c.propellant, `${where} › propellant`);
        return item;
      }),
    },
    wheels: {
      count: readNum(w.count, "wheel count"),
      elevation: readQ(w.elevation, "deg", "wheel elevation"),
      momentum: readQ(w.momentum, "N*m*s", "wheel momentum"),
      torque: readQ(w.torque, "N*m", "wheel torque"),
      momentum_use_factor: readPercent(w.momentum_use_factor, "momentum use factor"),
      torque_derating: readPercent(w.torque_derating, "torque derating"),
      comments: textOf(w.comments),
    },
    settling_time: readQ(m.settling_time, "s", "settling time"),
  };
}

function readProject(data) {

/** Where a name is used: a list of short descriptions. */
function usesOf(kind, name) {
  if (kind !== "location") return [];
  const rows = project.equipment.filter((r) => r.location === name).map((r) => r.id || "a row");
  return rows.length > 3 ? [...rows.slice(0, 3), `${rows.length - 3} more`] : rows;

const live = new Set();

// ---------------------------------------------------------------- figures from the fields

const R_EARTH_KM = 6378.1; // astropy's R_earth, the IAU 2015 nominal equatorial radius
const MU_EARTH = 398600.4418; // km**3/s**2, astropy's GM_earth

/** A quantity in a unit of `factors`, or null when it is empty or in another unit. */
function inUnit(quantity, factors) {
  if (blank(quantity) || !(quantity.u in factors)) return null;
  return quantity.v * factors[quantity.u];
}
const toKm = (quantity) => inUnit(quantity, { km: 1, m: 0.001 });
const toKg = (quantity) => inUnit(quantity, { kg: 1, g: 0.001 });
const fmt = (x, digits = 1) => Number(x).toLocaleString("en", { minimumFractionDigits: digits, maximumFractionDigits: digits });

/** The orbit's figures that the other budgets read, from the altitude alone. */
function missionFigures() {
  const altitude = toKm(M.altitude);
  if (altitude == null || !(altitude > 0)) return null;
  const radius = R_EARTH_KM + altitude;
  const period = 2 * Math.PI * Math.sqrt(radius ** 3 / MU_EARTH);
  const speed = Math.sqrt(MU_EARTH / radius);
  return { period, perDay: 86400 / period, speed, ground: (speed * R_EARTH_KM) / radius };
}

function missionLine() {
  const node = el("div", { class: "derived" });
  const update = () => {
    const f = missionFigures();
    node.replaceChildren(el("span", { class: "k", text: "from the altitude" }),
      f ? el("span", { html: `period <b>${fmt(f.period / 60, 2)} min</b> · <b>${fmt(f.perDay, 2)}</b> orbits a day · orbital speed <b>${fmt(f.speed, 3)} km/s</b> · ground track <b>${fmt(f.ground, 3)} km/s</b>` }) : "give an altitude in km or m");
  };
  update();
  live.add(update);
  return node;
}

/** A row's mass: one unit times the count, and with its margin. Propellant takes none. */
function rowMass(r) {
  const unit = toKg(r.unit_mass);
  if (unit == null || r.units === "") return null;
  const entered = unit * r.units;
  const margin = r.mass_class === "propellant" || r.margin === "" ? 0 : r.margin;
  return { entered, withMargin: entered * (1 + margin / 100) };
}

/** The rows as entered, added by location, with the propellant on its own. */
function equipmentTotals() {
  const groups = new Map();
  const add = (key, mass) => {
    const g = groups.get(key) || { rows: 0, entered: 0, withMargin: 0 };
    g.rows += 1;
    g.entered += mass.entered;
    g.withMargin += mass.withMargin;
    groups.set(key, g);
  };
  for (const r of project.equipment) {
    const mass = rowMass(r);
    if (mass) add(r.mass_class === "propellant" ? "propellant" : r.location || "no location", mass);
  }
  return groups;
}

function totalsTable() {
  const table = el("table", { class: "totals" });
  const update = () => {
    const groups = equipmentTotals();
    const keys = [...groups.keys()].filter((k) => k !== "propellant").sort();
    if (groups.has("propellant")) keys.push("propellant");
    let entered = 0, withMargin = 0, rows = 0;
    table.replaceChildren(el("tr", {}, ["as entered, by location", "rows", "units × unit mass", "with equipment margins"].map((h) => el("th", { text: h }))));
    for (const key of keys) {
      const g = groups.get(key);
      entered += g.entered; withMargin += g.withMargin; rows += g.rows;
      table.append(el("tr", {}, el("td", { text: key === "propellant" ? "propellant, full" : key }), el("td", { text: g.rows }), el("td", { text: `${fmt(g.entered, 2)} kg` }), el("td", { text: `${fmt(g.withMargin, 2)} kg` })));
    }
    table.append(el("tr", { class: "sum" }, el("td", { text: "all rows" }), el("td", { text: rows }), el("td", { text: `${fmt(entered, 2)} kg` }), el("td", { text: `${fmt(withMargin, 2)} kg` })));
  };
  update();
  live.add(update);
  return table;
}

// ---------------------------------------------------------------- the checks

/** What the page's checks leave to the notebooks, for the checks pop-over. */
const CHECKS_NOTE = "The budgets themselves come from the notebooks.";

/** The page's own checks: names, units and ranges. The budgets themselves need the notebooks. */
function runChecks() {
  const problems = [];
  const add = (section, text, level = "error") => problems.push({ section, text, level });
  const positive = (section, label, quantity) => {
    if (blank(quantity)) add(section, `${label} is missing`);
    else if (!(quantity.v > 0)) add(section, `${label} must be above zero`);
  };
  const atLeast = (section, label, value, low) => {
    if (value === "" || value == null) add(section, `${label} is missing`);
    else if (!(value >= low)) add(section, `${label} must be ${low} or more`);
  };
  const pct = (section, label, quantity, low = 0, high = 100) => {
    if (blank(quantity)) add(section, `${label} is missing`);
    else if (!(quantity.v >= low && quantity.v <= high)) add(section, `${label} must be ${low > 0 ? "above 0 and at most" : `from ${low} to`} ${high} %`);
  };
  const noSpace = (section, label, text) => {
    if (!String(text).trim()) add(section, `${label} is missing`);
    else if (/\s/.test(String(text).trim())) add(section, `${label} has a space: "${text}"`);
  };
  const unique = (section, kind, names) => {
    const seen = new Set();
    for (const name of names) {
      if (!name.trim()) add(section, `a ${kind} has no name`);
      if (name === RESERVED) add(section, `no ${kind} can be called "${RESERVED}": the name is kept for comments`);
      if (seen.has(name)) add(section, `two ${kind}s are called "${name}"`);
      seen.add(name);
    }
  };

  // Mission
  positive("mission", "the altitude", M.altitude);
  if (!blank(M.inclination) && !(M.inclination.v >= 0 && M.inclination.v <= (M.inclination.u === "rad" ? Math.PI : 180))) add("mission", "the inclination must be from 0 to 180 deg");
  if (blank(M.inclination)) add("mission", "the inclination is missing");
  positive("mission", "the duration", M.duration);
  const km = toKm(M.altitude);
  if (km != null && km > 2000) add("mission", `${fmt(km, 0)} km is above low Earth orbit; quicksat's budgets are meant for it`, "note");

  // Mass
  {
    const L = project.mass.locations.items;
    unique("locations", "location", L.map((l) => l.name));
    for (const l of L) {
      noSpace("locations", `location ${l.name}: the name`, l.name);
      for (const key of ["system_margin", "harness_fraction", "harness_margin"]) atLeast("locations", `location ${l.name}: the ${key.replace("_", " ")}`, l[key], 0);
      if (l.name === LAUNCHER && l.retained_in_orbit) add("locations", `${LAUNCHER} is listed and stays in orbit, unlike its default`, "note");
      if (!project.equipment.some((r) => r.location === l.name)) add("locations", `no equipment is at ${l.name}`, "note");
    }
    const listed = new Set([...L.map((l) => l.name), LAUNCHER]);
    const pairs = new Set();
    project.equipment.forEach((r, i) => {
      const what = r.id || `row ${i + 1}`;
      noSpace("equipment", `${what}: the id`, r.id);
      if (!r.name.trim()) add("equipment", `${what}: the name is missing`);
      noSpace("equipment", `${what}: the location`, r.location);
      if (r.location && !listed.has(r.location)) add("equipment", `${what}: the location "${r.location}" is not in the locations`);
      noSpace("equipment", `${what}: the responsibility`, r.responsibility);
      noSpace("equipment", `${what}: the subsystem`, r.subsystem);
      if (blank(r.unit_mass)) add("equipment", `${what}: the unit mass is missing`);
      else if (toKg(r.unit_mass) == null) add("equipment", `${what}: "${qText(r.unit_mass)}" is not a mass`);
      else if (r.unit_mass.v < 0) add("equipment", `${what}: the unit mass cannot be below zero`);
      atLeast("equipment", `${what}: the margin`, r.margin, 0);
      if (r.units === "" || !(Number.isInteger(r.units) && r.units >= 0)) add("equipment", `${what}: the units must be a whole number, 0 or more`);
      if (r.mass_class === "propellant" && r.margin > 0) add("equipment", `${what}: propellant never takes a margin, so its ${r.margin} % is not used`, "note");
      const pair = `${r.id}@${r.location}`;
      if (r.id && pairs.has(pair)) add("equipment", `two rows at ${r.location} have the id "${r.id}"`);
      pairs.add(pair);
    });
    if (!project.equipment.length) add("equipment", "the list needs at least one row");
  }

  // Data
  {
    const { generation: G, downlink: D, storage: S } = project.data;
    positive("generation", "the raw data rate", G.raw_datarate);
    atLeast("generation", "the compression ratio", G.compression_ratio, 1);
    pct("generation", "the duty cycle", G.duty_cycle);
    if (blank(D.rate)) add("downlink", "the rate is missing");
    atLeast("downlink", "the contacts per day", D.contacts_per_day, 0);
    if (blank(D.avg_contact_duration)) add("downlink", "the average contact is missing");
    atLeast("storage", "the orbits without contact", S.orbits_without_contact, 0);
  }

  // Delta-V
  {
    const D = project.deltav;
    positive("dvconfig", "the Isp", D.propulsion.isp);
    atLeast("dvconfig", "the margin", D.margin, 0);
    project.manoeuvres.forEach((r, i) => {
      const what = r.id || `row ${i + 1}`;
      noSpace("manoeuvres", `${what}: the id`, r.id);
      noSpace("manoeuvres", `${what}: the phase`, r.phase);
      if (!MANOEUVRE_TYPES.includes(r.type)) add("manoeuvres", `${what}: "${r.type}" is not a manoeuvre type`);
      else if (!VALUE_UNITS[r.type].includes(r.value.u)) add("manoeuvres", `${what}: a ${r.type} takes ${VALUE_UNITS[r.type].join(" or ")}, not ${r.value.u}`);
      if (blank(r.value)) add("manoeuvres", `${what}: the value is missing`);
      atLeast("manoeuvres", `${what}: the count`, r.count, 0);
      atLeast("manoeuvres", `${what}: the loss factor`, r.loss_factor, 1);
    });
    const ids = project.manoeuvres.map((r) => r.id).filter(Boolean);
    for (const id of new Set(ids.filter((id, i) => ids.indexOf(id) !== i))) add("manoeuvres", `two rows have the id "${id}"`, "note");
    if (!project.manoeuvres.length) add("manoeuvres", "the list needs at least one manoeuvre");
  }

  // Agility
  {
    const A = project.agility;
    unique("cases", "case", A.cases.items.map((c) => c.name));
    if (!A.cases.items.length) add("cases", "there must be at least one case");
    for (const c of A.cases.items) {
      if (c.kind === "envelope") {
        for (const axis of ["x", "y", "z"]) positive("cases", `case ${c.name}: the body's ${axis}`, c.body[axis]);
        for (const axis of ["roll", "pitch"]) atLeast("cases", `case ${c.name}: the ${axis} appendage factor`, c.appendage_factor[axis], 1);
        pct("cases", `case ${c.name}: the propellant aboard`, c.propellant);
      } else {
        for (const axis of ["roll", "pitch"]) positive("cases", `case ${c.name}: the ${axis} inertia`, c.inertia[axis]);
      }
    }
    const W = A.wheels;
    if (W.count === "" || !(Number.isInteger(W.count) && W.count >= 1)) add("wheels", "the wheels must be a whole number, 1 or more");
    if (blank(W.elevation) || !(W.elevation.v >= 0 && W.elevation.v <= 90)) add("wheels", "the elevation must be from 0 to 90 deg");
    positive("wheels", "the momentum", W.momentum);
    positive("wheels", "the torque", W.torque);
    pct("wheels", "the momentum use factor", W.momentum_use_factor, 0.000001);
    pct("wheels", "the torque derating", W.torque_derating, 0.000001);
    if (blank(A.settling_time)) add("wheels", "the settling time is missing");
  }

  state.problems = problems;
  showProblems();
}

// quicksat sizing editor: writing the folder's files from the project.

// ---------------------------------------------------------------- writing the files

function start(comments) {
  const lines = [...HEADER, ""];
  if ((comments || "").trim()) { commentsLines(lines, 0, comments); lines.push(""); }
  return lines;
}

const finish = (lines) => {
  while (lines[lines.length - 1] === "") lines.pop();
  return lines.join("\n") + "\n";
};

/** A block of fields under its key, with its comments field last. */
function block(lines, indent, key, pairs, comments) {
  const pad = " ".repeat(indent);
  lines.push(`${pad}${key}:`);
  for (const [k, v] of pairs) if (v !== "" && v != null) lines.push(`${pad}  ${k}: ${v}`);
  commentsLines(lines, indent + 2, comments);
}

function missionYaml() {
  const lines = start(M.comments);
  for (const key of ["altitude", "inclination", "duration"]) {
    helpLines(lines, 0, key);
    lines.push(`${key}: ${yq(M[key])}`);
  }
  return finish(lines);
}

function massYaml() {
  const C = project.mass;
  const L = C.locations;
  const lines = start(C.comments);
  helpLines(lines, 0, "locations");
  if (!L.items.length && !L.comments.trim()) { lines.push("locations: {}"); return finish(lines); }
  lines.push("locations:");
  commentsLines(lines, 2, L.comments);
  for (const l of L.items) {
    itemLines(lines, 2, l.name, [["system_margin", yn(l.system_margin)], ["harness_fraction", yn(l.harness_fraction)], ["harness_margin", yn(l.harness_margin)], ["retained_in_orbit", l.retained_in_orbit ? "" : "false"]], l.comments);
  }
  return finish(lines);
}

function equipmentCsv() {
  const lines = [EQUIPMENT_COLUMNS.join(",")];
  for (const r of project.equipment) {
    lines.push([r.id, r.name, r.location, r.responsibility, r.subsystem, qText(r.unit_mass), r.margin, r.units, r.mass_class, r.comments].map(csvCell).join(","));
  }
  return lines.join("\n") + "\n";
}

function dataYaml() {
  const D = project.data;
  const lines = start(D.comments);
  const blocks = {
    generation: [["raw_datarate", yq(D.generation.raw_datarate)], ["compression_ratio", yn(D.generation.compression_ratio)], ["duty_cycle", yq(D.generation.duty_cycle)]],
    downlink: [["rate", yq(D.downlink.rate)], ["contacts_per_day", yn(D.downlink.contacts_per_day)], ["avg_contact_duration", yq(D.downlink.avg_contact_duration)]],
    storage: [["orbits_without_contact", yn(D.storage.orbits_without_contact)]],
  };
  for (const [key, pairs] of Object.entries(blocks)) {
    helpLines(lines, 0, key);
    block(lines, 0, key, pairs, D[key].comments);
    lines.push("");
  }
  return finish(lines);
}

function deltavYaml() {
  const D = project.deltav;
  const lines = start(D.comments);
  helpLines(lines, 0, "propulsion");
  block(lines, 0, "propulsion", [["isp", yq(D.propulsion.isp)]], D.propulsion.comments);
  lines.push("");
  helpLines(lines, 0, "margin");
  lines.push(`margin: ${yn(D.margin)}`);
  lines.push("");
  helpLines(lines, 0, "collision_avoidance");
  block(lines, 0, "collision_avoidance", [["return_burn", String(D.collision_avoidance.return_burn)]], D.collision_avoidance.comments);
  return finish(lines);
}

function manoeuvresCsv() {
  const lines = [MANOEUVRE_COLUMNS.join(",")];
  for (const r of project.manoeuvres) {
    lines.push([r.id, r.name, r.phase, r.type, qText(r.value), r.count, String(r.recurring), r.loss_factor, r.comments].map(csvCell).join(","));
  }
  return lines.join("\n") + "\n";
}

function agilityYaml() {
  const A = project.agility;
  const lines = start(A.comments);
  helpLines(lines, 0, "inertia_cases");
  lines.push("inertia_cases:");
  commentsLines(lines, 2, A.cases.comments);
  for (const c of A.cases.items) {
    const pairs = c.kind === "envelope"
      ? [["body", flowMap(["x", "y", "z"].map((axis) => [axis, yq(c.body[axis])]))],
         ["appendage_factor", flowMap(["roll", "pitch"].map((axis) => [axis, yn(c.appendage_factor[axis])]))],
         ["propellant", yq(c.propellant)]]
      : [["inertia", flowMap(["roll", "pitch"].map((axis) => [axis, yq(c.inertia[axis])]))]];
    block(lines, 2, ys(c.name), pairs, c.comments);
  }
  lines.push("");
  const W = A.wheels;
  helpLines(lines, 0, "wheels");
  block(lines, 0, "wheels", [["count", yn(W.count)], ["elevation", yq(W.elevation)], ["momentum", yq(W.momentum)], ["torque", yq(W.torque)], ["momentum_use_factor", yq(W.momentum_use_factor)], ["torque_derating", yq(W.torque_derating)]], W.comments);
  lines.push("");
  helpLines(lines, 0, "settling_time");
  lines.push(`settling_time: ${yq(A.settling_time)}`);
  return finish(lines);
}

/** Every file the folder saves: the mission, and the files of every budget. */
function projectFiles() {
  const n = project.names;
  const files = [{ kind: "mission", path: n.mission, text: missionYaml(), note: "the reference orbit and the design life" }];
  files.push({ kind: "mass", path: n.mass, text: massYaml(), note: "margins and harness" }, { kind: "equipment", path: n.equipment, text: equipmentCsv(), note: "the equipment list" });
  files.push({ kind: "data", path: n.data, text: dataYaml(), note: "the payload data flow" });
  files.push({ kind: "deltav", path: n.deltav, text: deltavYaml(), note: "the delta-V settings" }, { kind: "manoeuvres", path: n.manoeuvres, text: manoeuvresCsv(), note: "the manoeuvres" });
  files.push({ kind: "agility", path: n.agility, text: agilityYaml(), note: "the agility settings" });
  return files;
}

/** The file's own comments, for the files that can hold them. */
function fileComments(path) {
  const n = project.names;
  if (path === n.mission) return commentsBox(M, "Your comments on the mission", { note: "They go in the comments field at the top of the file." });
  for (const key of ["mass", "data", "deltav", "agility"]) {
    if (path === n[key]) return commentsBox(project[key], `Your comments on ${BUDGETS[key].label}`, { note: "They go in the comments field at the top of the file." });
  }
  if (path.endsWith(".csv")) return el("p", { class: "hint", text: "A CSV has no place for comments on the whole file. Each row has its comments column." });
  return null;
}

// ---------------------------------------------------------------- comments written by hand

/**
 * The block a comment belongs to: the block itself, a name for it, and the depth
 * of its path. A comment on a field inside the block keeps the field's name.
 */
function commentTarget(kind, path) {
  const [first, second] = path;
  const find = (list, name) => list.find((x) => x.name === name);
  if (kind === "mission") return [M, "the mission", 0];
  if (kind === "mass") {
    const L = project.mass.locations;
    if (first === "locations") return second != null && find(L.items, second) ? [find(L.items, second), `locations › ${second}`, 2] : [L, "locations", 1];
    return [project.mass, BUDGETS.mass.label, 0];
  }
  if (kind === "data") {
    if (["generation", "downlink", "storage"].includes(first)) return [project.data[first], first, 1];
    return [project.data, BUDGETS.data.label, 0];
  }
  if (kind === "deltav") {
    if (["propulsion", "collision_avoidance"].includes(first)) return [project.deltav[first], first, 1];
    return [project.deltav, BUDGETS.deltav.label, 0];
  }
  const C = project.agility.cases;
  if (first === "inertia_cases") return second != null && find(C.items, second) ? [find(C.items, second), `inertia_cases › ${second}`, 2] : [C, "inertia_cases", 1];
  if (first === "wheels") return [project.agility.wheels, "wheels", 1];
  return [project.agility, BUDGETS.agility.label, 0];
}

// ---------------------------------------------------------------- opening a folder or a file

const PAGE_TITLE = "quicksat Sizing Editor";

/** The kinds of the folder's YAML files, whose `#` comments the page reviews. */
const YAML_KINDS = ["mission", "mass", "data", "deltav", "agility"];

/** The folder's files, by kind, in the order the Start step lists them. */
const FILES = Object.keys(NAMES).map((kind) => ({ kind }));

/** Use an opened file of a kind in place of the page's. */
function useFile(kind, file) {
  if (/\.csv$/i.test(NAMES[kind]) && !file.header) throw new Error(`${file.name} is not a CSV file.`);
  DATA.files[kind] = file;
  project[kind] = readingFile(kind, () => READERS[kind](file));
  project.names[kind] = file.name;
  if (kind === "mission") M = project.mission;
}

/** The opener of one file of a kind, for its tab. */
const fileOpener = (kind, label) => ({
  label,
  pick: { accept: /\.csv$/i.test(NAMES[kind]) ? ".csv" : ".yaml,.yml" },
  async open(picked) {
    useFile(kind, await readPicked(picked.files[0]));
    return [kind];
  },
});

const OPENERS = {
  folder: {
    pick: { folder: true },
    hint: "A folder with the sizing files: mission.yaml, and the files of the budgets it holds.",
    async open(picked) {
      const files = {};
      for (const [kind, name] of Object.entries(NAMES)) {
        const entry = pickedFile(picked, name);
        files[kind] = entry ? await readPicked(entry) : null;
      }
      if (!Object.values(files).some(Boolean)) throw new Error(`${picked.folder || "The folder"} holds none of the sizing files, such as mission.yaml or equipment.csv.`);
      notices.files = {};
      DATA = { ...DATA, folder: picked.folder, label: picked.folder, files, checks: [] };
      project = readProject(DATA);
      M = project.mission;
      state.file = project.names.mission;
      return Object.keys(NAMES);
    },
  },
  mission: fileOpener("mission", "a mission file"),
  mass: fileOpener("mass", "a mass settings file"),
  equipment: fileOpener("equipment", "an equipment list"),
  data: fileOpener("data", "a data flow file"),
  deltav: fileOpener("deltav", "a delta-V settings file"),
  manoeuvres: fileOpener("manoeuvres", "a manoeuvre list"),
  agility: fileOpener("agility", "an agility settings file"),
};

// ---------------------------------------------------------------- start

Object.assign(page, {
  beforeDraw: () => live.clear(),
  afterChange: () => { for (const update of live) update(); },
});

startPage();
</script>
