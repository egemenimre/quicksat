<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicksat Sizing Editor</title>
<style>
/* quicksat editor: the styles that every editor page shares, in the scenario
   viewer's palette. A page adds its own after them. */
:root {
  --bg: #08111f;
  --panel: #0c1829;
  --panel-2: #102037;
  --line: #1a2e4a;
  --line-2: #24405f;
  --text: #cdd9ea;
  --muted: #7d93b3;
  --dim: #4f6789;
  --accent: #22d3ee;
  --accent-soft: rgba(34, 211, 238, 0.12);
  --amber: #f5b13d;
  --red: #f87171;
  --green: #34d399;
  --ok-bg: #0b2a22;
  --ok-line: #1f7a5a;
  --warn-bg: #2b2310;
  --warn-line: #8a6a1f;
  --fail-bg: #2d1418;
  --fail-line: #8f3341;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas,
    "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 12px/1.45 var(--mono);
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  overflow: hidden;
}
button, select, input, textarea { font: inherit; color: inherit; }

/* Header and tabs, as in the scenario viewer */
.top {
  display: flex; align-items: stretch; gap: 16px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(#0d1b2f, #0a1526);
  min-width: 0;
}
.top > * { align-self: center; }
.brand { color: var(--accent); font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; }
.brand::before { content: "\25C6  "; }
.brand span { color: var(--muted); font-weight: 400; margin-left: 6px; }
.spacer { flex: 1; }
.tabs { display: flex; align-self: stretch; overflow-x: auto; }
.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 11px 9px 9px; color: var(--muted); cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; white-space: nowrap;
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button .count {
  display: inline-block; min-width: 15px; margin-left: 6px; padding: 0 4px; border-radius: 7px;
  background: var(--fail-bg); border: 1px solid var(--fail-line); color: var(--red);
  font-size: 9.5px; line-height: 13px; letter-spacing: 0;
}
.tabs button .count[hidden] { display: none; }
.chip {
  border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 9px;
  color: var(--accent); background: var(--panel); white-space: nowrap; cursor: pointer;
}
.chip.bad { color: var(--red); border-color: var(--fail-line); background: var(--fail-bg); }
.chip.good { color: var(--green); border-color: var(--ok-line); background: var(--ok-bg); }
.btn {
  background: var(--panel); border: 1px solid var(--line-2); color: var(--text);
  border-radius: 3px; padding: 4px 10px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.small { padding: 1px 7px; font-size: 11px; }
.btn.danger:hover { border-color: var(--red); color: var(--red); }
.btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn:disabled { opacity: 0.4; cursor: default; border-color: var(--line-2); color: var(--text); }

.folder-name { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.folder-name::before { content: "\25B8  "; color: var(--dim); }

/* The banner: what to review before saving */
.banner[hidden] { display: none; }
.banner {
  padding: 5px 14px; background: var(--warn-bg); border-bottom: 1px solid var(--warn-line);
  color: var(--amber); font-size: 11px;
}
.banner b { color: var(--text); font-weight: 400; }

/* Main area: the pages, and any panel beside them */
main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 0; }
.pages { min-height: 0; min-width: 0; display: grid; }
.page { display: none; min-height: 0; min-width: 0; }
.page.active { display: grid; }

/* Setup: the step list, the step, and its information box */
#page-setup { grid-template-columns: 210px minmax(0, 1fr); }
.steps { border-right: 1px solid var(--line); overflow: auto; padding: 10px 0; background: #0a1424; }
.steps button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  background: none; border: 0; border-left: 2px solid transparent; padding: 5px 12px;
  color: var(--muted); cursor: pointer;
}
.steps button:hover { color: var(--text); }
.steps button.current { color: var(--accent); border-left-color: var(--accent); background: var(--accent-soft); }
.steps .num {
  flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-2);
  display: grid; place-items: center; font-size: 10px;
}
.steps button.visited .num { border-color: var(--ok-line); color: var(--green); }
.steps button.problem .num { border-color: var(--fail-line); color: var(--red); background: var(--fail-bg); }
.steps button.current .num { border-color: var(--accent); color: var(--accent); }
.steps .group { padding: 10px 12px 3px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; }
.step { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.step-head { padding: 12px 18px 10px; display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--line); }
.step-nav { margin-left: auto; display: flex; gap: 8px; }
.step-head .where { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; }
.step-head h2 { margin: 2px 0 0; font-size: 15px; font-weight: 600; color: var(--text); }
.step-body {
  overflow: auto; padding: 12px 18px 18px; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start;
}

/* A Setup step's information box, which the sign by its title opens */
.step-body .info { max-width: 900px; }
.step-head h2 .ibtn, .step-body h3 .ibtn { margin-left: 8px; vertical-align: 2px; }


/* The file's own comments, above its preview */
.preview-comments { padding: 0 14px 6px; border-bottom: 1px solid var(--line); }
.preview-comments .comments { margin-top: 6px; }
.preview-comments .hint { margin: 6px 0 0; }

/* Information boxes */
.info {
  border: 1px solid var(--line-2); border-left: 3px solid var(--accent); border-radius: 3px;
  background: var(--panel); padding: 10px 12px; font-size: 11.5px; line-height: 1.55; align-self: start;
}
.info h4 { margin: 0 0 6px; color: var(--accent); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
.info p { margin: 0 0 8px; }
.info p:last-child { margin-bottom: 0; }
.info b { color: var(--text); }
.info .k { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; display: block; margin-top: 8px; }
.info code, .card code { color: var(--amber); }
.card .info { margin: 0 0 10px; }

/* Theme tabs: a column of section cards */
.sheet { overflow: auto; padding: 12px 18px 30px; min-height: 0; }
.sheet-intro { color: var(--muted); margin: 2px 0 10px; max-width: 900px; }
.card {
  border: 1px solid var(--line); border-radius: 3px; background: #0a1526;
  margin: 0 0 12px; max-width: 1100px;
}
/* The sections that hold one wide table use the full width */
.card.wide { max-width: none; }
.card-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.card-head .title { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; color: var(--muted); }
.card-head .title b { color: var(--text); font-weight: 600; }
.card-head .file { color: var(--dim); font-size: 10.5px; }
.card-body { padding: 10px 12px; }
.ibtn {
  width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--dim); background: none;
  color: var(--muted); font: 600 9px/14px var(--mono); padding: 0; cursor: pointer;
}
.ibtn.on { border-color: var(--accent); color: var(--accent); }

/* Fields */
.fields { display: grid; grid-template-columns: minmax(140px, max-content) minmax(0, 1fr); gap: 7px 12px; align-items: center; }
.fields > label { color: var(--muted); }
.fields > label small { display: block; color: var(--dim); font-size: 10.5px; }
.ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
input[type=text], input[type=search], input[type=number], input[type=datetime-local], input[type=time], select, textarea {
  background: #050c18; border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 6px;
  color: var(--text); min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[type=number] { width: 90px; }
input.wide, select.wide { width: 260px; max-width: 100%; }
input.name { width: 150px; }
.unit { color: var(--muted); }
.hint { color: var(--dim); font-size: 10.5px; }
.radio-row { display: flex; gap: 6px; flex-wrap: wrap; }
.radio-row label {
  border: 1px solid var(--line-2); border-radius: 3px; padding: 4px 9px; cursor: pointer; color: var(--muted);
}
.radio-row label.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.radio-row input { display: none; }

/* Comments: the user's own notes, kept through every save */
.comments { margin-top: 10px; }
.comments summary { cursor: pointer; color: var(--muted); font-size: 11px; list-style: none; }
.comments summary::-webkit-details-marker { display: none; }
.comments summary::before { content: "+ "; color: var(--accent); }
.comments[open] summary::before { content: "\2212  "; }
.comments summary .has { color: var(--green); }
.comments textarea, .note-row textarea { width: 100%; min-height: 46px; resize: vertical; margin-top: 4px; }
.comments .kept { color: var(--dim); font-size: 10.5px; }

/* Item tables, such as the attitudes, the panels or the equipment */
.items { width: 100%; border-collapse: collapse; }
.items th {
  text-align: left; color: var(--dim); font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em;
  font-size: 10px; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.items td { padding: 4px 6px; border-bottom: 1px solid #12223a; vertical-align: middle; }
.items tr.selected > td { background: var(--accent-soft); }
.items tr.note-row > td { padding-top: 0; }
.items .tools { white-space: nowrap; text-align: right; }
.items .ctl { flex-wrap: nowrap; }
.items .ctl.wrap { flex-wrap: wrap; }
.items .ctl.gap { gap: 6px 22px; }
.items .push { margin-left: auto; }
.items tr.first > td { border-bottom: 0; padding-bottom: 2px; }
.items tr.second > td { padding-top: 2px; padding-bottom: 8px; padding-left: 18px; }
.overall { max-width: 1100px; margin: 0 0 12px; padding: 4px 12px 8px; border: 1px solid var(--line); border-radius: 3px; background: #0a1526; }
.step-body .overall { margin-bottom: 4px; }
.items .stack { display: grid; gap: 4px; justify-items: start; }
.items input[type=number] { width: 70px; }
.notebtn { color: var(--dim); }
.notebtn.has { color: var(--green); border-color: var(--ok-line); }
.add-row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.confirm { color: var(--red); font-size: 10.5px; }
.scroll-x { overflow-x: auto; }

/* Problems, the page's own basic checks */
.problems { margin: 0 0 8px; }
.problems:empty { display: none; }
.problems div {
  border: 1px solid var(--fail-line); background: var(--fail-bg); color: var(--red);
  border-radius: 3px; padding: 3px 8px; margin-bottom: 4px; font-size: 11px;
}
.problems div.note { border-color: var(--warn-line); background: var(--warn-bg); color: var(--amber); }
.popover {
  position: fixed; z-index: 30; right: 14px; top: 44px; width: 420px; max-height: 60vh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 3px; padding: 10px 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
}
.popover h4 { margin: 0 0 6px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; }
.popover a { color: var(--red); cursor: pointer; text-decoration: none; display: block; padding: 3px 0; border-bottom: 1px solid var(--line); }
.popover a span { color: var(--dim); }
.popover p { color: var(--muted); margin: 8px 0 0; font-size: 11px; }

/* Files */
#page-files { grid-template-columns: 260px minmax(0, 1fr); }
.filelist { border-right: 1px solid var(--line); overflow: auto; padding: 10px; background: #0a1424; }
.filelist .folder { color: var(--dim); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; }
.filelist button {
  display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
  border-radius: 3px; padding: 4px 8px; color: var(--muted); cursor: pointer;
}
.filelist button.current { color: var(--accent); border-color: var(--line-2); background: var(--panel); }
.filelist button small { color: var(--dim); display: block; font-size: 10px; }
.filelist .actions { display: grid; gap: 6px; margin-top: 14px; }
.filelist .fields { grid-template-columns: minmax(0, 1fr); }
.filelist input.wide { width: 100%; }
.filelist label { color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
.preview { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); min-height: 0; }
.preview-head { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.preview-head .name { color: var(--text); }
.preview pre {
  margin: 0; padding: 12px 16px; overflow: auto; min-height: 0; font: 11.5px/1.5 var(--mono); color: var(--text);
  white-space: pre; tab-size: 2;
}
.preview pre .c { color: #5d7598; }
.preview pre .h { color: var(--amber); }
.preview pre .u { color: var(--green); }

/* The review of the comments written by hand, above the file's text */
.review { margin: 10px 14px; border: 1px solid var(--warn-line); border-radius: 3px; background: var(--warn-bg); padding: 6px 10px; max-height: 40vh; overflow: auto; }
.review summary { cursor: pointer; color: var(--amber); }
.review summary b { font-weight: 600; }
.review .hint { margin: 6px 0; }
.review td { vertical-align: top; }
.review pre.comment-text { margin: 0; white-space: pre-wrap; color: var(--text); font: inherit; }
.review ul { margin: 4px 0 8px; padding-left: 18px; color: var(--muted); }
.review .done { color: var(--green); }
.warn { color: var(--amber); }

/* What quicksat's loaders said when the page was written */
.python-checks { margin-top: 16px; font-size: 11px; }
.python-checks h4 { margin: 0 0 6px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 400; }
.python-checks div { margin-bottom: 6px; }
.python-checks .ok { color: var(--green); }
.python-checks .bad { color: var(--red); }
.python-checks pre { margin: 4px 0 0; white-space: pre-wrap; color: var(--red); font: inherit; }
.popover .python-checks { border-top: 1px solid var(--line); padding-top: 8px; }


/* Parts that a page may use: greyed tabs and steps, section headings in a step,
   tables in the information boxes, and narrower fields */
.tabs button.off, .steps button.off { color: var(--dim); }
.step-body h3 {
  margin: 4px 0 8px; font-size: 10.5px; font-weight: 400; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}
.step-body h3 .file { color: var(--dim); text-transform: none; letter-spacing: 0; margin-left: 8px; }
.info table { border-collapse: collapse; margin: 4px 0 8px; }
.info td, .info th { padding: 2px 10px 2px 0; text-align: left; vertical-align: top; }
.info th { color: var(--dim); font-weight: 400; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
input.mid { width: 160px; }
input.short { width: 100px; }
.items td.fill { width: 100%; }
.items input.fill { width: 100%; min-width: 110px; }
.items td > label.ctl { white-space: nowrap; flex-wrap: nowrap; }

/* The folder's files: opening them, where they came from, whether they changed */
.open-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
/* Where a folder or a file can be dropped */
.drop-area { border: 1px dashed var(--line); border-radius: 4px; padding: 12px 14px; }
.drop-area.drag-over, .file-bar.drag-over { border-color: var(--accent); background: var(--accent-soft); }
.file-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 1100px; margin: 0 0 8px;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel);
}
.file-bar .file-name { color: var(--text); font-weight: 600; }
.file-state[data-value="unchanged"] { color: var(--muted); }
.file-state[data-value="downloaded"], .file-state[data-value="saved"] { color: var(--green); }
.file-state[data-value="modified"] { color: var(--amber); }
.file-state[data-value="new"] { color: var(--accent); }
.file-state[data-value="absent"] { color: var(--dim); }
.files-table td.ok, .checks .ok { color: var(--green); }
.files-table td.bad, .checks .bad { color: var(--red); }
.files-table td.warn, .checks .warn { color: var(--amber); }
.files-table tr.group-row > td { padding-top: 10px; color: var(--muted); border-bottom-color: var(--line); }
.files-table td .btn[hidden] { display: none; }
.review .key { color: var(--muted); }

@media (max-width: 900px) {
  #page-setup { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .steps { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
  .steps .group { display: none; }
  .steps button { width: auto; border-left: 0; border-bottom: 2px solid transparent; }
  .step-body { grid-template-columns: minmax(0, 1fr); }
  #page-files { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
}


/* The sizing editor's own parts: the figures worked out from the fields, and
   the equipment totals */
#page-setup { grid-template-columns: 230px minmax(0, 1fr); }
#page-files { grid-template-columns: 280px minmax(0, 1fr); }
.derived { margin-top: 10px; color: var(--muted); font-size: 11px; }
.derived b { color: var(--text); font-weight: 400; }
.derived .k { color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; margin-right: 8px; }
.items td.total { color: var(--muted); white-space: nowrap; text-align: right; }
.items th.right { text-align: right; }
.items tr.hidden-row { display: none; }
.totals { margin-top: 10px; border-collapse: collapse; font-size: 11px; }
.totals th { color: var(--dim); font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; padding: 2px 14px 2px 0; text-align: right; }
.totals th:first-child, .totals td:first-child { text-align: left; }
.totals td { padding: 2px 14px 2px 0; text-align: right; color: var(--text); }
.totals tr.sum td { border-top: 1px solid var(--line); color: var(--accent); }
@media (max-width: 900px) {
  #page-setup { grid-template-columns: minmax(0, 1fr); }
  #page-files { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">QUICKSAT<span>SIZING EDITOR</span></div>
  <div class="folder-name" id="folder" title="The folder of input files this page edits"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <button class="chip" id="checks-chip" title="The page's basic checks"></button>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main">
  <div class="pages" id="pages">
    <section class="page" id="page-setup">
      <nav class="steps" id="steps"></nav>
      <div class="step" id="step"></div>
    </section>
    <section class="page" id="page-mission"><div class="sheet" id="sheet-mission"></div></section>
    <section class="page" id="page-mass"><div class="sheet" id="sheet-mass"></div></section>
    <section class="page" id="page-equipment"><div class="sheet" id="sheet-equipment"></div></section>
    <section class="page" id="page-data"><div class="sheet" id="sheet-data"></div></section>
    <section class="page" id="page-deltav"><div class="sheet" id="sheet-deltav"></div></section>
    <section class="page" id="page-agility"><div class="sheet" id="sheet-agility"></div></section>
    <section class="page" id="page-files">
      <nav class="filelist" id="filelist"></nav>
      <div class="preview" id="preview"></div>
    </section>
  </div>
</main>
<div class="popover" id="popover" hidden></div>
<script id="help" type="application/json">{"folder":{"title":"Folder","info":"<p>This folder holds the input files of quicksat's sizing budgets. Each budget is a notebook, which reads its files and builds one table.<\/p>\n<p>Saving always writes every budget's files. A folder that lacks a budget's files gets them started here, as new, for you to fill in.<\/p>\n{{files}}\n<span class=\"k\">What follows<\/span>\n<p>Data, delta-V and agility read <code>mission.yaml<\/code>, so the folder always holds it. Delta-V and agility also read the mass budget: delta-V for the dry mass, and agility for the mass of an envelope case. Without the mass files, their notebooks must give a mass instead.<\/p>\n<p>These files share nothing with a scenario or power folder. The mission's orbit is a reference orbit for the budgets: it has no epoch and no node.<\/p>"},"mission":{"title":"Reference orbit and design life","info":"<p>The mission is a circular orbit and a design life. The other budgets read it from here, so they cannot disagree on the orbit.<\/p>\n<span class=\"k\">Altitude<\/span><p>Above the Earth's equatorial radius of 6378.1 km. quicksat models no eccentricity.<\/p>\n<span class=\"k\">Inclination<\/span><p>No budget reads it yet. It records the orbit that the budgets assume. A sun-synchronous orbit at 500 km has an inclination of about 97.4 deg.<\/p>\n<span class=\"k\">Duration<\/span><p>The design life. The delta-V budget multiplies each recurring manoeuvre's yearly count by it.<\/p>\n<span class=\"k\">What follows<\/span><p>The figures under the fields come from the altitude alone. The data budget uses the period and the orbits in a day. Delta-V uses the orbit's radius and speed. Agility uses the ground track speed.<\/p>"},"altitude":{"file":"Above the Earth's equatorial radius. The orbit is circular."},"inclination":{"file":"No budget reads it yet. It records the orbit the budgets assume."},"duration":{"file":"The design life. It scales the recurring manoeuvres."},"locations":{"title":"Locations: margins and harness","info":"<p>Every equipment row names a location, such as Platform or Payload. The location sets the row's system margin and harness, and whether it stays in orbit.<\/p>\n<span class=\"k\">System margin<\/span><p>In percent, on the location's subtotal, after each row's equipment margin.<\/p>\n<span class=\"k\">Harness<\/span><p>The harness is worked out, not listed. It is a percentage of the location's equipment mass before margin, without the propellant. The harness takes its own margin, and then the system margin.<\/p>\n<span class=\"k\">Stays in orbit<\/span><p>Untick it for hardware that leaves at separation.<\/p>\n<span class=\"k\">Launcher<\/span><p><code>Launcher<\/code> needs no entry. It has no margins and no harness, and leaves at separation. Any other location that the equipment names must be listed here.<\/p>","file":"Each location's system margin, harness and harness margin, in percent, and whether it stays in orbit."},"equipment":{"title":"Equipment","info":"<p>One row per item, with the mass of one unit and the number flown. The mass takes its unit, such as <code>750 g<\/code> or <code>62 kg<\/code>.<\/p>\n<span class=\"k\">Ids<\/span><p>An id has no spaces. Two rows may share an id only at different locations, such as the MLI on the payload and on the platform.<\/p>\n<span class=\"k\">Margin<\/span><p>The equipment margin, in percent, follows how mature the item is. A usual rule is 5 % for an item off the shelf, 10 % for one modified, and 20 % for a new design.<\/p>\n<span class=\"k\">Class<\/span><p><code>propellant<\/code> marks the propellant load. It never takes a margin, and the mass cases scale it from full to empty. Every other row is <code>equipment<\/code>.<\/p>\n<span class=\"k\">Responsibility and subsystem<\/span><p>They group the rows in the notebook's tables. They do not change the mass.<\/p>\n<span class=\"k\">What follows<\/span><p>The totals under the table add the rows as entered. The notebook adds the harness and the system margins.<\/p>"},"generation":{"title":"Payload data generation","info":"<p>What the payload makes in each orbit. The raw rate is divided by the compression ratio. The result flows for the duty cycle's share of each orbit.<\/p>\n<span class=\"k\">Raw data rate<\/span><p>The instrument's output before compression, such as <code>1000 Mbit/s<\/code>.<\/p>\n<span class=\"k\">Compression ratio<\/span><p>1 means no compression. It cannot be below 1.<\/p>\n<span class=\"k\">Duty cycle<\/span><p>The share of each orbit spent making data, up to 100 %. An imager that works only on the day side, over land, may need a few percent.<\/p>","file":"What the payload makes. The raw rate is divided by the compression ratio, and flows for the duty cycle's share of each orbit."},"downlink":{"title":"Downlink","info":"<p>What the link sends down. It is given per day, because ground contacts are counted over the station's day.<\/p>\n<span class=\"k\">Rate<\/span><p>The achieved throughput, not the symbol rate.<\/p>\n<span class=\"k\">Contacts per day<\/span><p>The usable passes in a day, from Mission Analysis. It need not be a whole number.<\/p>\n<span class=\"k\">Average contact<\/span><p>How long a usable pass lasts, on average.<\/p>","file":"What the link sends: the achieved throughput, the usable contacts in a day, and their average length."},"storage":{"title":"Storage","info":"<p>The memory is sized to hold the data of this many orbits without a usable pass. It need not be a whole number.<\/p>\n<span class=\"k\">What follows<\/span><p>The data budget compares what the payload makes with what the link sends. It then gives the memory for this case.<\/p>","file":"The memory is sized for this many orbits without a usable contact."},"dvconfig":{"title":"Propulsion and margin","info":"<p>The settings of the delta-V budget. The orbit and the design life come from <code>mission.yaml<\/code>.<\/p>\n<span class=\"k\">Isp<\/span><p>The specific impulse, for the rocket equation. Hydrazine monopropellant gives about 220 s.<\/p>\n<span class=\"k\">Margin<\/span><p>In percent, one allowance on the total delta-V.<\/p>\n<span class=\"k\">Collision avoidance<\/span><p>With the return burn, each avoidance goes up and comes back down, which doubles its delta-V. Leave it off when the satellite was due to be raised anyway. The avoidance then also pays off some of the drag make-up.<\/p>"},"propulsion":{"file":"The specific impulse, for the rocket equation."},"margin":{"file":"In percent, one allowance on the total delta-V."},"collision_avoidance":{"file":"return_burn is true when each avoidance comes back down, which doubles its delta-V."},"manoeuvres":{"title":"Manoeuvres","info":"<p>One row per manoeuvre. Its type sets how the value turns into a delta-V, and the unit that the value takes.<\/p>\n<table><tr><th>type<\/th><th>value<\/th><th>worked out as<\/th><\/tr>\n<tr><td><code>altitude_change<\/code><\/td><td>a length<\/td><td>a Hohmann transfer between two circular orbits<\/td><\/tr>\n<tr><td><code>collision_avoidance<\/code><\/td><td>a length<\/td><td>the same, doubled with the return burn<\/td><\/tr>\n<tr><td><code>inclination_change<\/code><\/td><td>an angle<\/td><td>a plane change at the orbital speed<\/td><\/tr>\n<tr><td><code>deorbit<\/code><\/td><td>a length<\/td><td>one burn that lowers the perigee to this altitude<\/td><\/tr>\n<tr><td><code>given<\/code><\/td><td>a speed<\/td><td>taken as it is<\/td><\/tr><\/table>\n<span class=\"k\">Count and per year<\/span><p>How many times. With <b>per year<\/b> ticked, the count is per year, and is multiplied by the design life.<\/p>\n<span class=\"k\">Loss factor<\/span><p>The finite-burn and gravity losses, as a factor on the ideal delta-V. 1.0 is an impulsive burn, and the factor cannot be below 1.<\/p>\n<span class=\"k\">Phase<\/span><p>It groups the rows in the notebook's tables, such as Commissioning, Operations and Disposal.<\/p>"},"cases":{"title":"Inertia cases","info":"<p>Each case is one spacecraft, with one set of mass properties. The names are yours: the agility notebook asks for a case by its name.<\/p>\n<span class=\"k\">Envelope estimate<\/span><p>A uniform box, with a factor on each axis for the arrays, radiators and booms. Its inertia follows the mass from the mass budget, at the propellant level given.<\/p>\n<span class=\"k\">Stated inertia<\/span><p>The roll and pitch inertia, as a mass properties report gives them. It is a fixed number: nothing checks that it still matches the mass budget.<\/p>\n<p>A case is one or the other, never both, so each figure has one source.<\/p>\n<span class=\"k\">Axes<\/span><p>x is along the track, y across it, and z towards nadir.<\/p>"},"inertia_cases":{"file":"Each case is an envelope estimate or a stated inertia, never both. An envelope is a body box with an appendage factor per axis, and follows the mass budget's mass. A stated inertia is fixed."},"wheels":{"title":"Reaction wheels and settling","info":"<p>A pyramid of reaction wheels, with its axis along yaw.<\/p>\n<span class=\"k\">Nameplate figures<\/span><p>The momentum and the torque of one wheel, as the vendor quotes them. The elevation is each wheel's angle above the pyramid's base.<\/p>\n<span class=\"k\">Use policy<\/span><p>The momentum use factor is the share of the momentum kept for slews. The rest stores disturbances. The torque derating is the share of the torque used in a slew. The rest is kept for control.<\/p>\n<span class=\"k\">Settling time<\/span><p>What the platform needs after a slew before the payload can work. It is added once, at the end of a manoeuvre.<\/p>\n<span class=\"k\">Not in the file<\/span><p>The time allowed for a slew. It is asked of a spacecraft, so the notebook passes it to each call.<\/p>","file":"A pyramid of reaction wheels about yaw. The momentum and the torque are nameplate figures per wheel. The use factor and the derating are the shares used in slews."},"settling_time":{"file":"What the platform needs after a slew before the payload can work."},"save":{"title":"Save the files","info":"<p>Saving writes each file again. The page writes its own help as lines that start with #. Your notes are kept in the comments fields.<\/p>\n<p>Download the zip, or each file alone. Then put the files back in the folder, and run the notebooks.<\/p>"}}</script>
