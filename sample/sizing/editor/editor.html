<script>// quicksat editor: the helpers and the field controls, which every editor page
// shares.
//
// The page holds one project in memory. The Setup steps and the theme tabs draw
// the same sections from it, so they cannot disagree. Every change goes through
// `changed`, in frame.js, which re-runs the basic checks and refreshes what shows
// the files.
"use strict";

// ---------------------------------------------------------------- helpers

const $ = (selector, root = document) => root.querySelector(selector);

/** Build an element: el("div", {class: "x", text: "y", onclick: f}, child, ...). */
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value == null || value === false) continue;
    if (key === "text") node.textContent = value;
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "value") node.value = value;
    else if (key === "checked") node.checked = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

/** A quantity: a value and a unit, such as q(510, "km"). An empty value is "". */
const q = (v, u) => ({ v, u });

/** A quantity as a file writes it, such as `510 km` or `3 orbits`. */
function qText(quantity) {
  if (!quantity || quantity.v === "" || quantity.v == null) return "";
  if (quantity.u === "orbits") return `${quantity.v} ${Number(quantity.v) === 1 ? "orbit" : "orbits"}`;
  return quantity.u ? `${quantity.v} ${quantity.u}` : `${quantity.v}`;
}

const blank = (quantity) => !quantity || quantity.v === "" || quantity.v == null;

const escapeHtml = (text) => String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/** Text, or "" for anything that is not text or a number. */
const str = (value) => (typeof value === "string" ? value : typeof value === "number" ? String(value) : "");

// ---------------------------------------------------------------- constants

/** The key of the user's notes in every block. No named item may take it. */
const RESERVED = "comments";

// ---------------------------------------------------------------- field controls

/** A grid of labelled fields. */
function grid(parent) {
  const node = el("div", { class: "fields" });
  parent.append(node);
  return node;
}

function row(gridNode, label, control, hint) {
  gridNode.append(el("label", {}, label, hint ? el("small", { text: hint }) : null), control);
}

function textInput(obj, key, { cls = "", placeholder = "", onchange } = {}) {
  return el("input", {
    type: "text", class: cls, value: obj[key] ?? "", placeholder,
    oninput: (e) => { if (!onchange) { obj[key] = e.target.value; changed(); } },
    onchange: (e) => { if (onchange) onchange(e.target.value, e.target); },
  });
}

function numberInput(obj, key, { step = "any", min, max, width, placeholder = "" } = {}) {
  return el("input", {
    type: "number", step, min, max, placeholder, value: obj[key] ?? "", style: width ? `width:${width}px` : null,
    oninput: (e) => { obj[key] = e.target.value === "" ? "" : Number(e.target.value); changed(); },
  });
}

/** A value with a unit chosen from a list. */
function quantityInput(obj, key, units, { placeholder = "" } = {}) {
  const quantity = obj[key] || (obj[key] = q("", units[0]));
  const value = el("input", {
    type: "number", step: "any", value: quantity.v, placeholder,
    oninput: (e) => { quantity.v = e.target.value === "" ? "" : Number(e.target.value); changed(); },
  });
  const unit = units.length === 1 && quantity.u === units[0]
    ? el("span", { class: "unit", text: units[0] })
    : selectInput(quantity, "u", units);
  return el("span", { class: "ctl" }, value, unit);
}

function selectInput(obj, key, options, { cls = "", onchange, blank: none } = {}) {
  const select = el("select", {
    class: cls,
    onchange: (e) => {
      obj[key] = e.target.value;
      if (onchange) onchange(e.target.value);
      changed(Boolean(onchange));
    },
  });
  if (none != null) select.append(el("option", { value: "", text: none }));
  for (const option of options) {
    const [value, label] = Array.isArray(option) ? option : [option, option];
    select.append(el("option", { value, text: label }));
  }
  const current = obj[key] ?? "";
  if (current !== "" && ![...select.options].some((o) => o.value === current)) {
    select.append(el("option", { value: current, text: `${current} (not defined)` }));
  }
  select.value = current;
  return select;
}

function checkbox(obj, key, label, { structure = false, onchange } = {}) {
  return el("label", { class: "ctl" },
    el("input", {
      type: "checkbox", checked: Boolean(obj[key]),
      onchange: (e) => { obj[key] = e.target.checked; if (onchange) onchange(e.target.checked); changed(structure); },
    }),
    label);
}

/** Choose one of several, shown as buttons. */
function radioRow(obj, key, options) {
  const node = el("div", { class: "radio-row" });
  for (const [value, label] of options) {
    node.append(el("label", { class: obj[key] === value ? "on" : "" },
      el("input", { type: "radio", checked: obj[key] === value, onchange: () => { obj[key] = value; changed(true); } }),
      label));
  }
  return node;
}

/** The user's comments on a block: written to its `comments` field, and never changed by the editor. */
function commentsBox(obj, label = "Your comments", { open = false, note } = {}) {
  const has = () => (obj.comments || "").trim() !== "";
  const summary = el("summary", {}, label, " ", el("span", { class: "has", text: has() ? "· written" : "" }));
  const area = el("textarea", {
    placeholder: "Comments you want to keep. They are saved in this block's comments field.",
    value: obj.comments || "",
    oninput: (e) => {
      obj.comments = e.target.value;
      summary.querySelector(".has").textContent = has() ? "· written" : "";
      changed();
    },
  });
  return el("details", { class: "comments", open: open || has() },
    summary, area,
    el("div", { class: "kept", text: note || "Kept through every edit and save. The lines starting with # in the file are help, and are rewritten on each save." }));
}

/** A small button that opens an item's comments in a row below it. */
function commentsButton(item, colspan, tbody, tr) {
  const has = () => (item.comments || "").trim() !== "";
  const button = el("button", { class: "btn small notebtn" + (has() ? " has" : ""), text: "comments", title: "Your comments on this item" });
  let noteRow = null;
  const open = () => {
    noteRow = el("tr", { class: "note-row" }, el("td", { colspan },
      el("textarea", {
        placeholder: "Comments you want to keep. They are saved in this item's comments field.",
        value: item.comments || "",
        oninput: (e) => { item.comments = e.target.value; button.classList.toggle("has", has()); changed(); },
      })));
    tr.after(noteRow);
  };
  button.addEventListener("click", () => {
    if (noteRow) { noteRow.remove(); noteRow = null; } else open();
  });
  if (has()) queueMicrotask(open);
  return button;
}

/**
 * Delete, and up and down for a list whose order means something, such as the
 * activities. Delete asks again when the item is in use. `copy` adds a copy button.
 */
function itemTools(list, index, { kind, name, order = false, copy } = {}) {
  const uses = kind ? usesOf(kind, name) : [];
  const key = `${kind}:${name}:${index}`;
  const pending = state.pendingDelete === key;
  return el("span", { class: "tools" },
    order && el("button", { class: "btn small", text: "↑", title: "Move up", disabled: index === 0, onclick: () => { [list[index - 1], list[index]] = [list[index], list[index - 1]]; changed(true); } }),
    order && el("button", { class: "btn small", text: "↓", title: "Move down", disabled: index === list.length - 1, onclick: () => { [list[index + 1], list[index]] = [list[index], list[index + 1]]; changed(true); } }),
    copy && el("button", { class: "btn small", text: "copy", title: "Add a copy below this one", onclick: () => { list.splice(index + 1, 0, copy(list[index])); changed(true); } }),
    pending ? el("span", { class: "confirm", text: ` used by ${uses.join(", ")}. ` }) : null,
    el("button", {
      class: "btn small danger", text: pending ? "delete anyway" : "delete",
      onclick: () => {
        if (uses.length && !pending) { state.pendingDelete = key; changed(true); return; }
        state.pendingDelete = null;
        list.splice(index, 1);
        changed(true);
      },
    }));
}

/** A name field that renames on change, and updates every use of the name. */
function nameInput(item, kind, siblings) {
  return textInput(item, "name", {
    cls: "name",
    onchange: (value, input) => {
      const name = value.trim();
      if (!name || name === item.name) { input.value = item.name; return; }
      if (siblings().filter((n) => n === name).length) {
        input.value = item.name;
        alert(`There is already one called "${name}".`);
        return;
      }
      if (kind) rename(kind, item.name, name);
      item.name = name;
      changed(true);
    },
  });
}

// quicksat editor: writing YAML and CSV text, the zip, and the downloads.

/** The lines at the top of every YAML file the editor writes. */
const HEADER = [
  "# Written by the quicksat editor. Lines that start with # are help text: the",
  "# editor writes them, and rewrites them each time it saves this file. Put the",
  "# comments you want to keep in a comments field. Every block has one, and the",
  "# editor keeps them as they are.",
];

/** A YAML scalar: plain when that reads back as the same string, otherwise in double quotes. */
function ys(value) {
  const text = String(value);
  const plainChars = /^[A-Za-z0-9_+\-./() %]+$/;
  const special = /^(true|false|yes|no|on|off|y|n|null|~)$/i;
  const numeric = /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/;
  if (text === "" || !plainChars.test(text) || special.test(text) || numeric.test(text) || /^\s|\s$/.test(text) || /^- /.test(text) || /^%/.test(text)) {
    return JSON.stringify(text);
  }
  return text;
}

/** A quantity for the file, or "" when it is empty, so that the field is left out. */
const yq = (quantity) => (blank(quantity) ? "" : ys(qText(quantity)));

/** A plain number for the file, or "" when the field is empty. */
const yn = (value) => (value === "" || value == null ? "" : String(value));

/** Write help lines from `YAML_HELP`, wrapped to 80 characters, when the user wants help. */
function helpLines(lines, indent, key) {
  if (!state.writeHelp || !YAML_HELP[key]) return;
  const pad = " ".repeat(indent);
  const width = 80 - indent - 2;
  let line = "";
  for (const word of YAML_HELP[key].split(" ")) {
    if ((line + " " + word).trim().length > width) { lines.push(`${pad}# ${line.trim()}`); line = ""; }
    line += " " + word;
  }
  if (line.trim()) lines.push(`${pad}# ${line.trim()}`);
}

/**
 * The comments field. A short comment takes one line. A long one is folded with
 * `>-` over lines of 80 characters, which YAML reads back as the same text. Text
 * with line breaks of its own is kept as it is, with `|-`.
 */
function commentsLines(lines, indent, text) {
  text = (text || "").trim();
  if (!text) return;
  const pad = " ".repeat(indent);
  if (!text.includes("\n")) {
    const line = `${pad}comments: ${ys(text)}`;
    if (line.length <= 80 || /  |\t/.test(text)) { lines.push(line); return; }
    lines.push(`${pad}comments: >-`);
    let row = "";
    for (const word of text.split(" ")) {
      if (row && pad.length + 2 + row.length + 1 + word.length > 80) { lines.push(`${pad}  ${row}`); row = ""; }
      row = row ? `${row} ${word}` : word;
    }
    lines.push(`${pad}  ${row}`);
    return;
  }
  lines.push(`${pad}comments: |-`);
  for (const line of text.split("\n")) lines.push(line ? `${pad}  ${line}` : "");
}

/** A flow map, such as {part: Wing +y, axis: +y}, leaving out the empty values. */
const flowMap = (pairs) => `{${pairs.filter(([, v]) => v !== "" && v != null).map(([k, v]) => `${k}: ${v}`).join(", ")}}`;

/**
 * Write a named item: on one line when it has no comments, or as a block with its
 * comments field when it has.
 */
function itemLines(lines, indent, name, pairs, comments) {
  const pad = " ".repeat(indent);
  if (!(comments || "").trim()) { lines.push(`${pad}${ys(name)}: ${flowMap(pairs)}`); return; }
  lines.push(`${pad}${ys(name)}:`);
  for (const [k, v] of pairs) if (v !== "" && v != null) lines.push(`${pad}  ${k}: ${v}`);
  commentsLines(lines, indent + 2, comments);
}

/** A CSV cell, quoted when it holds a comma, a quote or a line break. */
function csvCell(value) {
  const text = value == null ? "" : String(value);
  return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

// ---------------------------------------------------------------- downloads

const fileBytes = (file) => file.bytes || new TextEncoder().encode(file.text);

function saveBlob(blob, name) {
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function download(file) {
  saveBlob(new Blob([fileBytes(file)]), file.path.split("/").pop());
}

/** Every file of the page, in one zip with the folder's name. */
function downloadZip() {
  const folder = (project.name || "quicksat_project").replace(/[^A-Za-z0-9_.-]+/g, "_");
  saveBlob(zipBlob(projectFiles().map((f) => ({ name: `${folder}/${f.path}`, data: fileBytes(f) }))), `${folder}.zip`);
  markSaved(projectFiles().map((file) => file.kind), "export");
  refreshFiles();
}

// A zip with no compression: CRC-32, a local header per file, then the central directory
const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let crc = 0xffffffff;
  for (const byte of bytes) crc = CRC_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
  return (crc ^ 0xffffffff) >>> 0;
}

/** A zip of `entries`, each a name with its folder and its bytes, stored without compression. */
function zipBlob(entries) {
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [];
  const central = [];
  let offset = 0;
  const put = (view, fields) => fields.forEach(([at, value, size]) => (size === 4 ? view.setUint32(at, value, true) : view.setUint16(at, value, true)));
  for (const { name, data } of entries) {
    const nameBytes = new TextEncoder().encode(name);
    const crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    put(local, [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, time, 2], [12, date, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, nameBytes.length, 2], [28, 0, 2]]);
    const entry = new DataView(new ArrayBuffer(46));
    put(entry, [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, time, 2], [14, date, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, nameBytes.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]);
    parts.push(local, nameBytes, data);
    central.push(entry, nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const size = central.reduce((n, part) => n + part.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  put(end, [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, entries.length, 2], [10, entries.length, 2], [12, size, 4], [16, offset, 4], [20, 0, 2]]);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}

// quicksat editor: opening files in the browser.
//
// A page opens a folder, or one file, that the user picks. YAML is read with
// js-yaml, CSV with the reader below, and the `#` comments are found with the
// same rules as `comment_blocks` in editor.py. The two must agree: a test runs
// both on quicksat's own files.

/**
 * The schema closest to PyYAML's safe loader: YAML's core types, with merge
 * keys. Dates are kept as text, as the page reads them as text anyway.
 */
const YAML_SCHEMA = typeof jsyaml === "undefined" ? null : jsyaml.CORE_SCHEMA.extend({ implicit: [jsyaml.types.merge] });

/** A YAML file for the page: its name, its data and its comments, as editor.py gives them. */
function readYaml(name, text) {
  let data;
  try {
    data = jsyaml.load(text, { schema: YAML_SCHEMA, filename: name });
  } catch (error) {
    const where = error.mark ? `, line ${error.mark.line + 1}` : "";
    throw new Error(`${name} is not valid YAML${where}: ${error.reason || error.message}`);
  }
  return { name, data: data ?? null, comments: commentBlocks(text) };
}

/** A CSV file for the page: its header and its rows of text, without the empty rows. */
function readCsv(name, text) {
  const rows = parseCsv(text);
  return { name, header: rows[0] || [], rows: rows.slice(1).filter((row) => row.some((cell) => cell.trim())) };
}

/** The rows of a CSV text, as Python's csv module reads them: quotes, doubled quotes, and line breaks in quotes. */
function parseCsv(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;
  let started = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') quoted = false; else cell += c;
    } else if (c === '"') { quoted = true; started = true; } else if (c === ",") { row.push(cell); cell = ""; started = true; } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      if (started || cell) row.push(cell);
      rows.push(row);
      row = []; cell = ""; started = false;
    } else { cell += c; started = true; }
  }
  if (started || cell) { row.push(cell); rows.push(row); }
  return rows;
}

// ---------------------------------------------------------------- the comments

const LINE_BREAK = /\r\n|\r|\n/;
const indentOf = (line) => line.length - line.replace(/^ +/, "").length;

/** The comment at the end of a line of YAML, outside any quotes, or null. */
function inlineComment(line) {
  let quote = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quote !== null) { if (c === quote) quote = null; } else if (c === "'" || c === '"') quote = c; else if (c === "#" && i > 0 && (line[i - 1] === " " || line[i - 1] === "\t")) return line.slice(i + 1).trim();
  }
  return null;
}

/**
 * The place of every key and every list item in a YAML text, with its path:
 * [line, column, path], counted from 0, in the order of the file, as editor.py's
 * `_key_lines` finds them with PyYAML's nodes. It reads the layouts that YAML
 * files use: block mappings and lists, flow collections over one line or more,
 * quoted and plain values, and block scalars, whose lines it skips.
 */
function keyLines(text) {
  const lines = text.split(LINE_BREAK);
  const found = [];
  const stack = []; // the open blocks: { indent, seq, path, count }
  let pending = null; // a key or a list item whose value starts on a later line
  let scalarIndent = -1; // a block scalar's lines are indented more than this
  const top = () => stack[stack.length - 1];

  /** The quoted text at `line`, `i`, which may run over several lines: its end, and its value. */
  function quoted(n, i) {
    const q = lines[n][i];
    let value = "";
    let j = i + 1;
    for (;;) {
      const line = lines[n];
      if (j >= line.length) {
        if (n + 1 >= lines.length) return { n, i: j, value };
        n += 1; j = 0; value += " ";
        continue;
      }
      const c = line[j];
      if (q === '"' && c === "\\") { value += c + (line[j + 1] ?? ""); j += 2; continue; }
      if (c === q) {
        if (q === "'" && line[j + 1] === "'") { value += "'"; j += 2; continue; }
        try { value = q === '"' ? JSON.parse(`"${value}"`) : value; } catch { /* keep the text as written */ }
        return { n, i: j + 1, value };
      }
      value += c;
      j += 1;
    }
  }

  /** A mapping key at `line`, `col`: its value, and where the text after its colon starts; or null. */
  function keyAt(n, col) {
    const line = lines[n];
    const c = line[col];
    if (c === '"' || c === "'") {
      const end = quoted(n, col);
      if (end.n !== n) return null;
      let j = end.i;
      while (line[j] === " " || line[j] === "\t") j += 1;
      return line[j] === ":" && (j + 1 >= line.length || line[j + 1] === " " || line[j + 1] === "\t") ? { key: end.value, after: j + 1 } : null;
    }
    if ("[]{},#&*!|>%@`".includes(c)) return null;
    for (let j = col; j < line.length; j++) {
      if (line[j] === "#" && j > col && (line[j - 1] === " " || line[j - 1] === "\t")) return null;
      if (line[j] === ":" && (j + 1 >= line.length || line[j + 1] === " " || line[j + 1] === "\t")) return { key: line.slice(col, j).trim(), after: j + 1 };
    }
    return null;
  }

  // ------------------------------------------ flow collections: [a, b] and {k: v}

  const cursor = (n, i) => ({ n, i });
  const at = (cur) => (cur.n < lines.length ? lines[cur.n][cur.i] : undefined);

  /** Move past spaces, line ends and comments. False at the end of the text. */
  function skipSpace(cur) {
    for (;;) {
      if (cur.n >= lines.length) return false;
      const line = lines[cur.n];
      if (cur.i >= line.length) { cur.n += 1; cur.i = 0; continue; }
      const c = line[cur.i];
      if (c === " " || c === "\t") { cur.i += 1; continue; }
      if (c === "#" && (cur.i === 0 || line[cur.i - 1] === " " || line[cur.i - 1] === "\t")) { cur.i = line.length; continue; }
      return true;
    }
  }

  /** Move past a value inside a flow collection: a collection, quoted text, or plain text. */
  function flowValue(cur, path) {
    const c = at(cur);
    if (c === "[" || c === "{") { flow(cur, path); return; }
    if (c === '"' || c === "'") { const end = quoted(cur.n, cur.i); cur.n = end.n; cur.i = end.i; return; }
    const line = lines[cur.n];
    while (cur.i < line.length && !",]}".includes(line[cur.i]) && !(line[cur.i] === "#" && line[cur.i - 1] === " ")) cur.i += 1;
  }

  /** A flow collection, from its opening bracket. */
  function flow(cur, path) {
    const seq = at(cur) === "[";
    const close = seq ? "]" : "}";
    cur.i += 1;
    let index = 0;
    while (skipSpace(cur)) {
      const c = at(cur);
      if (c === close) { cur.i += 1; return; }
      if (c === ",") { cur.i += 1; continue; }
      if (seq) {
        found.push([cur.n, cur.i, [...path, index]]);
        flowValue(cur, [...path, index]);
        index += 1;
        continue;
      }
      const start = cursor(cur.n, cur.i);
      let key;
      if (c === '"' || c === "'") {
        const end = quoted(cur.n, cur.i);
        key = end.value; cur.n = end.n; cur.i = end.i;
      } else {
        const line = lines[cur.n];
        let j = cur.i;
        while (j < line.length && !",}".includes(line[j]) && !(line[j] === ":" && (j + 1 >= line.length || " ,]}".includes(line[j + 1])))) j += 1;
        key = line.slice(cur.i, j).trim();
        cur.i = j;
      }
      found.push([start.n, start.i, [...path, key]]);
      if (!skipSpace(cur)) return;
      if (at(cur) === ":") {
        cur.i += 1;
        if (skipSpace(cur) && !",}".includes(at(cur))) flowValue(cur, [...path, key]);
      }
    }
  }

  // ------------------------------------------ block collections

  /** The list whose items start at `col`, opened or found. */
  function listAt(n, col) {
    if (pending && col >= pending.indent) {
      if (pending.item) found.push([n, col, pending.path]);
      stack.push({ indent: col, seq: true, path: pending.path, count: -1 });
      pending = null;
      return top();
    }
    pending = null;
    while (stack.length && top().indent > col) stack.pop();
    if (stack.length && top().seq && top().indent === col) return top();
    if (!stack.length) { stack.push({ indent: col, seq: true, path: [], count: -1 }); return top(); }
    return null;
  }

  /** The mapping whose keys start at `col`, opened or found. */
  function mapAt(n, col) {
    if (pending && col > pending.indent) {
      if (pending.item) found.push([n, col, pending.path]);
      stack.push({ indent: col, seq: false, path: pending.path });
      pending = null;
      return top();
    }
    pending = null;
    while (stack.length && (top().indent > col || (top().seq && top().indent >= col))) stack.pop();
    if (stack.length && !top().seq && top().indent === col) return top();
    if (!stack.length) { stack.push({ indent: col, seq: false, path: [] }); return top(); }
    return null;
  }

  /** A value that starts at `line`, `col`. Returns the last line it takes. */
  function value(n, col, path, parentIndent, inItem) {
    const line = lines[n];
    let c = line[col];
    while (c === "&" || c === "!") {
      while (col < line.length && line[col] !== " ") col += 1;
      while (line[col] === " ") col += 1;
      c = line[col];
      if (c === undefined || c === "#") { pending = { path, indent: parentIndent }; return n; }
    }
    if (c === "[" || c === "{") { const cur = cursor(n, col); flow(cur, path); return cur.n; }
    if (c === "|" || c === ">") { scalarIndent = parentIndent; return n; }
    if (c === '"' || c === "'") return quoted(n, col).n;
    if (inItem && c === "-" && (col + 1 >= line.length || line[col + 1] === " ")) {
      stack.push({ indent: col, seq: true, path, count: -1 });
      return entry(n, col);
    }
    if (inItem && keyAt(n, col)) {
      stack.push({ indent: col, seq: false, path });
      return entry(n, col);
    }
    return n;
  }

  /** The block node that starts at `line`, `col`: a list item, a key, or plain text. Returns the last line it takes. */
  function entry(n, col) {
    const line = lines[n];
    if (line[col] === "-" && (col + 1 >= line.length || line[col + 1] === " ")) {
      const list = listAt(n, col);
      if (!list) return n;
      list.count += 1;
      const path = [...list.path, list.count];
      let v = col + 1;
      while (line[v] === " ") v += 1;
      if (v >= line.length || line[v] === "#") { pending = { path, indent: col, item: true }; return n; }
      found.push([n, v, path]);
      return value(n, v, path, col, true);
    }
    const key = keyAt(n, col);
    if (!key) { pending = null; return n; }
    const map = mapAt(n, col);
    if (!map) return n;
    const path = [...map.path, key.key];
    found.push([n, col, path]);
    let v = key.after;
    while (line[v] === " " || line[v] === "\t") v += 1;
    if (v >= line.length || line[v] === "#") { pending = { path, indent: col }; return n; }
    return value(n, v, path, col, false);
  }

  for (let n = 0; n < lines.length; n++) {
    const line = lines[n];
    if (scalarIndent >= 0) {
      if (!line.trim() || indentOf(line) > scalarIndent) continue;
      scalarIndent = -1;
    }
    const col = indentOf(line);
    const rest = line.slice(col);
    if (!rest.trim() || rest.startsWith("#") || rest.startsWith("%") || /^(---|\.\.\.)(\s|$)/.test(rest)) continue;
    n = entry(n, col);
  }
  return found;
}

/**
 * Every `#` comment in a YAML text, with the key it belongs to: the same rules,
 * and the same result, as `comment_blocks` in editor.py.
 */
function commentBlocks(text) {
  const keys = keyLines(text);
  const lines = text.split(LINE_BREAK);
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  const blocks = [];
  let current = null;
  lines.forEach((line, n) => {
    const stripped = line.replace(/^\s+/, "");
    if (stripped.startsWith("#")) {
      let body = stripped.slice(1);
      if (body.startsWith(" ")) body = body.slice(1);
      if (current && current.end === n - 1) {
        current.lines.push(body);
        current.end = n;
      } else {
        current = { start: n, end: n, lines: [body], indent: line.length - stripped.length };
        blocks.push(current);
      }
      return;
    }
    current = null;
    const comment = inlineComment(line);
    if (comment !== null) {
      const key = keys.find(([at]) => at === n);
      blocks.push({ start: n, end: n, lines: [comment], path: key ? key[2] : [] });
    }
  });
  return blocks.map((block) => ({
    line: block.start + 1,
    text: block.lines.join("\n").replace(/^\n+|\n+$/g, ""),
    path: block.path || ownerOf(keys, block, lines),
    inline: Boolean(block.path),
  }));
}

/** The path of the key that a block of full-line comments belongs to, as `_owner` in editor.py. */
function ownerOf(keys, block, lines) {
  const below = keys.find(([line]) => line > block.end);
  if (!below) return [];
  const [keyLine, column, path] = below;
  if (column < block.indent) {
    const siblings = keys.filter(([line, col]) => line < block.start && col === block.indent);
    if (siblings.length) return siblings[siblings.length - 1][2].slice(0, -1);
  }
  const after = block.end + 1;
  if (after < keyLine && !lines[after].trim()) return path.slice(0, -1);
  return path;
}

// ---------------------------------------------------------------- picking files

/**
 * Ask the user for files, and resolve with them once picked: the folder's name,
 * if a folder was picked, and each file with its path inside that folder.
 */
function pickFiles({ folder = false, multiple = false, accept = "" } = {}) {
  return new Promise((resolve) => {
    const input = el("input", { type: "file", accept: accept || null, multiple: multiple || folder || null, hidden: true });
    if (folder) input.webkitdirectory = true;
    input.addEventListener("change", () => {
      const files = [...input.files].map((file) => {
        const parts = (file.webkitRelativePath || file.name).split("/");
        return { path: folder ? parts.slice(1).join("/") : file.name, file };
      });
      const name = folder && files.length ? (input.files[0].webkitRelativePath || "").split("/")[0] : "";
      input.remove();
      resolve({ folder: name, files });
    });
    document.body.append(input);
    input.click();
  });
}

/**
 * The files of a drop, as `pickFiles` gives them: one folder, with each file's
 * path inside it, or loose files, with no folder. `folder` is true for a folder.
 * The browser lets go of the drop's items once the event ends, so they are taken
 * before anything waits.
 */
async function droppedFiles(transfer) {
  const entries = [...transfer.items].filter((item) => item.kind === "file").map((item) => item.webkitGetAsEntry && item.webkitGetAsEntry());
  const loose = [...transfer.files];
  const folders = entries.filter((entry) => entry && entry.isDirectory);
  if (!folders.length) return { folder: "", files: loose.map((file) => ({ path: file.name, file })), isFolder: false };
  if (folders.length > 1 || entries.length > 1) throw new Error("Drop one folder, or files, but not both or several folders.");
  const files = [];
  await readFolderEntry(folders[0], "", files);
  return { folder: folders[0].name, files, isFolder: true };
}

/** Each file under a dropped folder, with its path inside the folder. */
async function readFolderEntry(entry, prefix, files) {
  const reader = entry.createReader();
  for (;;) {
    // a reader gives a folder's entries in batches, until one comes back empty
    const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
    if (!batch.length) return;
    for (const child of batch) {
      const path = prefix + child.name;
      if (child.isDirectory) await readFolderEntry(child, `${path}/`, files);
      else files.push({ path, file: await new Promise((resolve, reject) => child.file(resolve, reject)) });
    }
  }
}

/** A picked file by its path in the folder, such as `spacecraft.glb` or `./orbits/sso.tle`. */
function pickedFile(picked, path) {
  if (typeof path !== "string" || !path.trim()) return null;
  const wanted = path.trim().replace(/\\/g, "/").replace(/^(\.\/)+/, "");
  return picked.files.find((entry) => entry.path === wanted) || null;
}

/** The YAML or CSV of a picked file, read for the page. */
async function readPicked(entry) {
  const text = await entry.file.text();
  return /\.csv$/i.test(entry.path) ? readCsv(entry.path, text) : readYaml(entry.path, text);
}

// quicksat editor: the page's frame, which the scenario and the sizing editors
// share.
//
// The frame draws the tabs and the Setup steps, the information signs, the
// problems, the Files tab with its preview, and the review of the `#` comments
// written by hand. It opens a folder, or one file, in place of the ones the page
// holds. A page gives it these, by name:
//
//   DATA, project                 the files as read, and the project made of them
//   PAGE_TITLE, CHECKS_NOTE       the page's name, and what its checks leave out
//   TABS, STEPS, SECTIONS         the tabs, the steps and the sections
//   YAML_KINDS                    its YAML files' kinds
//   FILES                         the folder's files, by kind: [{kind}]
//   OPENERS                       how the folder, and each of its files, opens
//   projectFiles()                the files to save, each with its kind
//   fileComments(path)            the comments box of a whole file, or null
//   commentTarget(kind, path)     the block of a comment: [block, label, depth]
//   runChecks()                   its checks, which end with showProblems()
//
// and, if it needs them, the hooks in `page`. The help comes from the page's
// #help script, which Python fills from quicksat/editor/help/.

/** What a page may add to the frame's work. */
const page = {
  /** After a tab or a Setup step is shown. */
  onShow() {},
  /** Before a tab or a step is drawn. */
  beforeDraw() {},
  /** After a change, once the checks have run. */
  afterChange() {},
  /** Whether a tab or a step is greyed out, such as for a file the folder does not hold. */
  isOff: () => false,
  /** The text the Files tab shows for a binary file. */
  describeBinary: (file) => `A binary file of ${(file.bytes.length / 1024).toFixed(1)} kB.`,
  /** What the Files tab shows under its buttons, such as the scenario editor's viewer, or null. */
  filesExtra: () => null,
  /** The kind of a dropped file that no fixed name gives, such as a satellite target's file, or null. */
  kindOfFile: () => null,
};

/** What the page shows: the tab, the Setup step, the open explanations, and more. */
const state = {
  tab: "setup",
  step: 0,
  visited: new Set([0]),
  openInfo: new Set(),
  writeHelp: true,
  file: "",
  pendingDelete: null,
  problems: [],
  // whether the review box in the Files tab is open: null until the user opens or closes it
  reviewOpen: null,
};

// ---------------------------------------------------------------- what reading noticed

/**
 * What the readers noticed, for each file: fields the page does not handle, and
 * values it read differently. A file opened again replaces its own notices.
 */
const notices = {
  files: {},
  reading: "",
  get unknown() { return Object.values(this.files).flatMap((file) => file.unknown); },
  get changed() { return Object.values(this.files).flatMap((file) => file.changed); },
};

/** Note something about the file being read: `unknown` or `changed`. */
function notice(kind, text) {
  const file = (notices.files[notices.reading] ||= { unknown: [], changed: [] });
  file[kind].push(text);
}

/** Read one file, with its notices in place of the ones it had. */
function readingFile(kind, read) {
  notices.reading = kind;
  notices.files[kind] = { unknown: [], changed: [] };
  try { return read(); } finally { notices.reading = ""; }
}

// ---------------------------------------------------------------- changes

let refreshTimer = 0;

/**
 * Note a change to the project. A change of structure, such as an item added,
 * deleted or renamed, redraws the current view. Every change re-runs the checks.
 */
function changed(structure = false) {
  if (structure) drawView();
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    runChecks();
    if (state.tab === "files") drawPreview();
    page.afterChange();
  }, 120);
}

// ---------------------------------------------------------------- tabs and steps

/** The file a section belongs to, by its name in this folder, and anything else it changes. */
const fileOf = (section) => (project.names[section.file] || section.file) + (section.also ? ` ${section.also}` : "");

function drawTabs() {
  $("#tabs").replaceChildren(...TABS.map((tab) => el("button", {
    "data-tab": tab.id, class: [state.tab === tab.id ? "active" : "", page.isOff(tab) ? "off" : ""].join(" "),
    onclick: () => showTab(tab.id),
  }, tab.title, el("span", { class: "count", hidden: true }))));
}

function showTab(id) {
  state.tab = id;
  state.pendingDelete = null;
  for (const section of document.querySelectorAll(".page")) section.classList.toggle("active", section.id === `page-${id}`);
  page.onShow();
  drawView();
  runChecks();
}

function showStep(i) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, i));
  state.visited.add(state.step);
  state.pendingDelete = null;
  page.onShow();
  drawView();
  runChecks();
  const body = $(".step-body");
  if (body) body.scrollTop = 0;
}

function goToSection(section) {
  const step = STEPS.findIndex((s) => s.sections.includes(section));
  const tab = TABS.find((t) => (t.sections || []).includes(section));
  if (state.tab === "setup" && step >= 0) { showStep(step); return; }
  if (tab) {
    showTab(tab.id);
    const card = document.querySelector(`.card[data-section="${section}"]`);
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
  } else if (step >= 0) { showTab("setup"); showStep(step); }
}

function drawView() {
  page.beforeDraw();
  drawTabs();
  const scroll = document.querySelector(".page.active .sheet, .page.active .step-body");
  const top = scroll ? scroll.scrollTop : 0;
  if (state.tab === "setup") drawSetup();
  else if (state.tab === "files") drawFiles();
  else drawSheet(TABS.find((t) => t.id === state.tab));
  const again = document.querySelector(".page.active .sheet, .page.active .step-body");
  if (again) again.scrollTop = top;
  showProblems();
}

/**
 * A section's information sign, the small "i" by its title, and the box it
 * opens. The box is open or closed for the section, wherever it is drawn: on its
 * card in a tab, and on its Setup step.
 */
function infoSign(id) {
  const info = el("div", { class: "info", html: INFO[id], hidden: !state.openInfo.has(id) });
  const ibtn = el("button", {
    class: "ibtn" + (state.openInfo.has(id) ? " on" : ""), text: "i", title: "What this is, the options and what follows",
    onclick: () => {
      if (state.openInfo.has(id)) state.openInfo.delete(id); else state.openInfo.add(id);
      info.hidden = !state.openInfo.has(id);
      ibtn.classList.toggle("on", state.openInfo.has(id));
    },
  });
  return [ibtn, info];
}

/** A theme tab: its introduction, a bar for each of its files, and a card for each section. */
function drawSheet(tab) {
  const sheet = $(`#sheet-${tab.id}`);
  const kinds = [...new Set(tab.sections.map((id) => SECTIONS[id].file))].filter((kind) => OPENERS[kind]);
  sheet.replaceChildren(el("p", { class: "sheet-intro", text: tab.intro }), ...kinds.map(fileBar));
  if (tab.top) sheet.append(tab.top() || "");
  for (const id of tab.sections) {
    const section = SECTIONS[id];
    const [ibtn, info] = infoSign(id);
    const body = el("div", { class: "card-body" }, info, el("div", { class: "problems", "data-section": id }));
    section.render(body, { setup: false });
    sheet.append(el("div", { class: "card" + (section.wide ? " wide" : ""), "data-section": id },
      el("div", { class: "card-head" }, el("span", { class: "title" }, el("b", { text: section.title })), ibtn, el("span", { class: "spacer" }), el("span", { class: "file", text: fileOf(section) })),
      body));
  }
}

function drawSetup() {
  const nav = $("#steps");
  nav.replaceChildren();
  STEPS.forEach((step, i) => {
    if (step.group) nav.append(el("div", { class: "group", text: step.group }));
    nav.append(el("button", {
      "data-step": i,
      class: [i === state.step ? "current" : "", state.visited.has(i) ? "visited" : "", page.isOff(step) ? "off" : ""].join(" "),
      onclick: () => showStep(i),
    }, el("span", { class: "num", text: i + 1 }), step.title));
  });
  const step = STEPS[state.step];
  // A step of one section has its sign by the step's title, and its box at the
  // top. A step of several has a sign by each section's heading, and the box
  // under it.
  const single = step.sections.length === 1;
  const signs = step.sections.map(infoSign);
  const form = el("div");
  if (single) form.append(signs[0][1]);
  if (step.top) form.append(step.top() || "");
  step.sections.forEach((id, k) => {
    const [ibtn, info] = signs[k];
    if (!single) form.append(el("h3", {}, SECTIONS[id].title, ibtn, el("span", { class: "file", text: fileOf(SECTIONS[id]) })), info);
    form.append(el("div", { class: "problems", "data-section": id }));
    SECTIONS[id].render(form, { setup: true });
  });
  const group = [...STEPS.slice(0, state.step + 1)].reverse().find((s) => s.group).group;
  const files = [...new Set(step.sections.map((id) => fileOf(SECTIONS[id])))].join(", ");
  $("#step").replaceChildren(
    el("div", { class: "step-head" },
      el("div", {}, el("div", { class: "where", text: `Step ${state.step + 1} of ${STEPS.length} · ${group} · ${files}` }), el("h2", {}, step.title, ...(single ? [signs[0][0]] : []))),
      el("div", { class: "step-nav" },
        el("button", { class: "btn", text: "← Back", disabled: state.step === 0, onclick: () => showStep(state.step - 1) }),
        state.step < STEPS.length - 1
          ? el("button", { class: "btn primary", text: "Next →", onclick: () => showStep(state.step + 1) })
          : el("button", { class: "btn primary", text: "Download the zip", onclick: downloadZip }))),
    el("div", { class: "step-body" }, form));
}

// ---------------------------------------------------------------- problems

/** Put the problems where they belong: the header, the tabs, the steps and the sections. */
function showProblems() {
  const errors = state.problems.filter((p) => p.level === "error");
  const chip = $("#checks-chip");
  chip.textContent = errors.length ? `${errors.length} problem${errors.length > 1 ? "s" : ""}` : "basic checks pass";
  chip.className = "chip " + (errors.length ? "bad" : "good");
  for (const tab of TABS) {
    const n = errors.filter((p) => (tab.sections || []).includes(p.section)).length;
    const count = document.querySelector(`#tabs button[data-tab=${tab.id}] .count`);
    if (count) { count.textContent = n; count.hidden = !n; }
  }
  STEPS.forEach((step, i) => {
    const button = document.querySelector(`#steps button[data-step="${i}"]`);
    if (button) button.classList.toggle("problem", errors.some((p) => step.sections.includes(p.section)));
  });
  for (const box of document.querySelectorAll(".problems[data-section]")) {
    box.replaceChildren(...state.problems.filter((p) => p.section === box.dataset.section)
      .map((p) => el("div", { class: p.level === "note" ? "note" : "", text: p.text })));
  }
  if (!$("#popover").hidden && $("#popover").dataset.kind === "checks") showChecksPopover();
  refreshFiles();
}

function showChecksPopover() {
  const pop = $("#popover");
  pop.dataset.kind = "checks";
  const where = (section) => {
    const step = STEPS.find((s) => s.sections.includes(section));
    return step ? step.title : section;
  };
  pop.replaceChildren(
    el("h4", { text: "The page's basic checks" }),
    ...state.problems.map((p) => el("a", {
      onclick: () => { goToSection(p.section); pop.hidden = true; },
      style: p.level === "note" ? "color: var(--amber)" : null,
    }, p.text, el("span", { text: `  ${where(p.section)}` }))),
    state.problems.length ? null : el("p", { text: "Nothing found." }),
    el("p", { text: `This is the simple check: names, units and ranges only. ${CHECKS_NOTE}` }),
    pythonChecks());
  pop.hidden = false;
}

/** The files that the full check refused, each with quicksat's message. */
function pythonChecks() {
  const refused = DATA.checks.filter((check) => check.ok === false);
  if (!refused.length) return null;
  return el("div", { class: "python-checks" },
    el("h4", { text: "The full check refused" }),
    ...refused.map((check) => el("div", { class: "bad" }, el("b", { text: check.file }), el("pre", { text: check.message }))));
}

// ---------------------------------------------------------------- the Files tab

function drawFiles() {
  const files = projectFiles();
  if (!files.some((f) => f.path === state.file)) state.file = files[0].path;
  const list = $("#filelist");
  list.replaceChildren(el("div", { class: "folder", text: `${project.name}/` }));
  for (const file of files) {
    list.append(el("button", {
      class: state.file === file.path ? "current" : "",
      onclick: () => { state.file = file.path; drawFiles(); },
    }, file.path, el("small", {}, file.note ? `${file.note} · ` : "", el("span", { "data-state": file.kind })),
      el("small", { class: "checks" }, "simple ", el("span", { "data-checks": file.kind }), " · full ", fullCheck("span", file.kind))));
  }
  list.append(el("div", { class: "actions" },
    el("label", {}, el("input", { type: "checkbox", checked: state.writeHelp, onchange: (e) => { state.writeHelp = e.target.checked; drawFiles(); } }), "write the # help lines"),
    el("button", { class: "btn primary", text: `download ${project.name}.zip`, onclick: downloadZip })));
  list.append(el("div", { class: "fields", style: "margin-top: 14px" },
    el("label", {}, "Folder name"),
    textInput(project, "name", { cls: "wide" })));
  const extra = page.filesExtra();
  if (extra) list.append(extra);
  for (const id of TABS.find((t) => t.id === "files").sections || []) list.append(el("div", { class: "problems", "data-section": id }));
  drawPreview(true);
  // the list is drawn anew, so fill in each file's state and simple check again
  refreshFiles();
}

/**
 * Show a file. A full redraw draws the head, the review and the file's comments
 * box. Otherwise only the text is refreshed, so typing is not interrupted.
 */
function drawPreview(full = false) {
  const files = projectFiles();
  const file = files.find((f) => f.path === state.file) || files[0];
  const preview = $("#preview");
  const text = file.bytes ? page.describeBinary(file) : null;
  const pre = preview.querySelector("pre.file");
  if (!full && pre && preview.dataset.file === file.path) {
    if (text) pre.textContent = text; else pre.innerHTML = highlight(file.text);
    return;
  }
  preview.dataset.file = file.path;
  const comments = fileComments(file.path);
  preview.replaceChildren(
    reviewPanel(),
    el("div", { class: "preview-head" },
      el("span", { class: "name", text: file.path }), file.note ? el("span", { class: "hint", text: file.note }) : null,
      el("span", { class: "spacer" }),
      el("span", { class: "hint", html: '<span style="color:var(--amber)">#</span> header &nbsp; <span style="color:#5d7598">#</span> help, rewritten &nbsp; <span style="color:var(--green)">comments</span> yours, kept' }),
      el("button", { class: "btn small", text: "download", onclick: () => download(file) })),
    comments ? el("div", { class: "preview-comments" }, comments) : el("div"),
    text ? el("pre", { class: "file", text }) : el("pre", { class: "file", html: highlight(file.text) }));
}

/** Colour a file's text: the header, the help lines, and the user's comments fields. */
function highlight(text) {
  const out = [];
  let inHeader = true;
  let blockIndent = -1;
  for (const line of text.split("\n")) {
    const indent = line.match(/^ */)[0].length;
    if (blockIndent >= 0 && (line.trim() === "" || indent > blockIndent)) { out.push(`<span class="u">${escapeHtml(line)}</span>`); continue; }
    blockIndent = -1;
    if (inHeader && line.startsWith("#")) { out.push(`<span class="h">${escapeHtml(line)}</span>`); continue; }
    inHeader = false;
    if (/^\s*#/.test(line)) { out.push(`<span class="c">${escapeHtml(line)}</span>`); continue; }
    const comments = line.match(/^(\s*(?:- )?)comments: (.*)$/);
    if (comments) {
      out.push(`<span class="u">${escapeHtml(line)}</span>`);
      if (comments[2] === "|-" || comments[2] === ">-") blockIndent = indent;
      continue;
    }
    out.push(escapeHtml(line));
  }
  return out.join("\n");
}

// ---------------------------------------------------------------- comments written by hand

const normalise = (text) => String(text).replace(/\s+/g, " ").trim().toLowerCase();

/** Every comment the editor writes itself: the header and the help. */
const generatedComments = () => new Set([...Object.values(YAML_HELP), HEADER.map((line) => line.replace(/^# ?/, "")).join(" ")].map(normalise));

/** The comments that the editor did not write, and so would replace on saving. */
let review = [];

/** List the comments of the files of `kinds`, in place of the ones they had. */
function reviewFiles(kinds) {
  const generated = generatedComments();
  review = review.filter((item) => !kinds.includes(item.kind));
  for (const kind of kinds) {
    const file = DATA.files[kind];
    if (!file || !file.comments) continue;
    for (const comment of file.comments) {
      if (generated.has(normalise(comment.text))) continue;
      const [target, label, depth = comment.path.length] = commentTarget(kind, comment.path);
      const key = comment.path.slice(depth).filter((part) => typeof part === "string").join(".");
      review.push({ kind, file: file.name, line: comment.line, text: comment.text, key, target, label, status: "" });
    }
  }
  review.sort((a, b) => YAML_KINDS.indexOf(a.kind) - YAML_KINDS.indexOf(b.kind) || a.line - b.line);
}

const openReview = () => review.filter((item) => !item.status);

/** Move a comment into its block's comments. A comment on a field starts with the field's name. */
function moveComment(item) {
  const text = item.key ? `${item.key}: ${item.text.trim()}` : item.text.trim();
  item.target.comments = item.target.comments && item.target.comments.trim() ? `${item.target.comments.trim()}\n${text}` : text;
  item.status = "moved";
}

function settle(change) {
  change();
  updateBanner();
  drawView();
  changed();
}

/** The review of the comments written by hand, and what the reader could not keep. */
function reviewPanel() {
  const open = openReview();
  const panel = el("details", { class: "review", open: state.reviewOpen ?? (open.length > 0 || notices.unknown.length > 0) });
  panel.addEventListener("toggle", () => { state.reviewOpen = panel.open; });
  const count = open.length ? `${open.length} comment${open.length > 1 ? "s" : ""} written by hand` : "No comments left to review";
  panel.append(el("summary", {}, el("b", { text: count }), notices.unknown.length ? ` · ${notices.unknown.length} field${notices.unknown.length > 1 ? "s" : ""} the editor cannot keep` : ""));
  if (review.length) {
    panel.append(el("p", { class: "hint", text: "The files hold these # comments, which the editor did not write. Saving replaces every # line, so move each comment you want to keep into the comments field of its block. A comment on a field starts with the field's name." }));
    const table = el("table", { class: "items" });
    for (const item of review) {
      table.append(el("tr", {},
        el("td", { class: "hint", text: `${item.file}:${item.line}` }),
        el("td", {}, el("pre", { class: "comment-text" }, item.key ? el("span", { class: "key", text: `${item.key}: ` }) : null, item.text)),
        el("td", { class: "hint", text: `→ ${item.label}` }),
        el("td", { class: "tools" }, item.status
          ? el("span", { class: item.status === "moved" ? "done" : "hint", text: item.status === "moved" ? "moved" : "dropped" })
          : [el("button", { class: "btn small", text: "move", onclick: () => settle(() => moveComment(item)) }), " ",
             el("button", { class: "btn small danger", text: "drop", onclick: () => settle(() => { item.status = "dropped"; }) })])));
    }
    panel.append(el("div", { class: "scroll-x" }, table));
    if (open.length) {
      panel.append(el("div", { class: "add-row" },
        el("button", { class: "btn", text: "move all", onclick: () => settle(() => open.forEach(moveComment)) }),
        el("button", { class: "btn danger", text: "drop all", onclick: () => settle(() => open.forEach((item) => { item.status = "dropped"; })) })));
    }
  }
  if (notices.unknown.length) {
    panel.append(el("p", { class: "hint", text: "These fields are not in the editor, so saving leaves them out. Keep a copy of the file if you need them:" }),
      el("ul", {}, ...notices.unknown.map((text) => el("li", { text }))));
  }
  if (notices.changed.length) {
    panel.append(el("p", { class: "hint", text: "Read differently from how the files write them:" }),
      el("ul", {}, ...notices.changed.map((text) => el("li", { text }))));
  }
  return panel;
}

/** A line for the Save step: what is left to review before saving. */
function reviewNote() {
  const open = openReview();
  if (!open.length && !notices.unknown.length) return null;
  return el("p", { class: "warn" },
    open.length ? `${open.length} comment${open.length > 1 ? "s" : ""} written by hand would be lost on saving. ` : "",
    notices.unknown.length ? `${notices.unknown.length} field${notices.unknown.length > 1 ? "s are" : " is"} not in the editor, and would be left out. ` : "",
    el("button", { class: "btn small", text: "review in the Files tab", onclick: () => showTab("files") }));
}

/** The banner under the header, while there is something to review before saving. */
function updateBanner() {
  const banner = $("#banner");
  const open = openReview();
  if (!open.length && !notices.unknown.length) { banner.hidden = true; return; }
  banner.hidden = false;
  banner.replaceChildren(
    el("b", { text: "Before you save: " }),
    open.length ? `these files hold ${open.length} comment${open.length > 1 ? "s" : ""} written by hand, which saving would replace. ` : "",
    notices.unknown.length ? `${notices.unknown.length} field${notices.unknown.length > 1 ? "s are" : " is"} not in the editor. ` : "",
    el("button", { class: "btn small", text: "review them", onclick: () => showTab("files") }));
}

// ---------------------------------------------------------------- the folder's files

/** The explanation of the table of files and of the buttons, for each page's first step. */
const FILES_HELP = `<span class="k">The table of files</span>
<p><b>From</b> says where each file came from: the folder the page was written for, a folder you opened, or a file opened alone. A browser does not tell a page which folder a file opened alone came from.</p>
<p><b>State</b> says whether the file has changed: <i>unchanged</i> since it was opened, <i>modified</i>, <i>downloaded</i> when saved and not changed since, <i>saved into the folder</i> by the Activity Designer, or <i>new</i> for a file started on the page.</p>
<p><b>Simple check</b> is the page's own: names, units and ranges, run as you type. <b>Full check</b> is quicksat's own loaders, which read the files when Python wrote the page. A file opened since shows <i>not run</i>: write the page again for its full check. On a page that the Scenario Editor's server sends, a reload, or a run that creates the viewer, gives the full check too.</p>
<span class="k">Opening and saving</span>
<p><b>Open a folder</b> reads every file of the folder that the page knows, and fills every step. <b>Open</b>, on a row or on a tab, reads one file in place of that one. You can also drop a folder, or its files, on the first Setup step or anywhere on the page, and a file on its tab's bar. <b>download</b> saves one file, and the Files tab saves them all as a zip. Put the files back in the folder yourself: a browser cannot write into it.</p>`;

// ---------------------------------------------------------------- the help

// The help of the page's domains, by key, from quicksat/editor/help/: a step's
// title and information box, and the help written above a key of a saved file.
const HELP = JSON.parse($("#help").textContent);

/** Each step's information box, as HTML. */
const INFO = Object.fromEntries(Object.entries(HELP).filter(([, h]) => h.info)
  .map(([key, h]) => [key, `<h4>${h.title}</h4>\n${h.info.replace("{{files}}", FILES_HELP)}`]));

/** The help written as `#` lines above each key, when the user wants it. */
const YAML_HELP = Object.fromEntries(Object.entries(HELP).filter(([, h]) => h.file).map(([key, h]) => [key, h.file]));

/**
 * Where each file came from, by its kind: `{how, folder}`. `how` is `page` for a
 * file that Python wrote into the page, `folder` for one opened with its folder,
 * `file` for one opened alone, and `new` for one started on the page.
 */
const sources = {};

/** Each file's text, or bytes, as it was last opened or saved: a file that differs has changed. */
const savedText = {};

/**
 * How each file was last saved, by kind: `download` once the page has saved it,
 * `folder` once the editor's server has written it into the folder, and
 * otherwise not set.
 */
const savedBy = {};

/** Each file's text, or bytes, as saving would write it now, by kind. The help lines are always in. */
function currentTexts() {
  const writeHelp = state.writeHelp;
  state.writeHelp = true;
  try {
    return Object.fromEntries(projectFiles().map((file) => [file.kind, file.text ?? file.bytes]));
  } finally {
    state.writeHelp = writeHelp;
  }
}

/** Note the files of `kinds` as saved, as they are now: opened, downloaded, or saved into the folder. */
function markSaved(kinds, by = "") {
  const texts = currentTexts();
  for (const kind of kinds) {
    if (!(kind in texts)) continue;
    savedText[kind] = texts[kind];
    if (by) savedBy[kind] = by; else delete savedBy[kind];
  }
}

/**
 * Each file's state, by kind: `unchanged` since it was opened, `downloaded` or
 * `saved` into the folder and not changed since, `modified` since any of them,
 * `new` for a file never saved, or `absent` for one the page does not save.
 */
function fileStates() {
  const texts = currentTexts();
  const stateOf = (kind) => {
    if (!(kind in texts)) return "absent";
    if (!(kind in savedText)) return "new";
    if (texts[kind] !== savedText[kind]) return "modified";
    return { download: "downloaded", folder: "saved" }[savedBy[kind]] || "unchanged";
  };
  // the fixed kinds, and any the page saves beyond them, such as a satellite target's file
  const kinds = new Set([...FILES.map(({ kind }) => kind), ...Object.keys(texts)]);
  return Object.fromEntries([...kinds].map((kind) => [kind, stateOf(kind)]));
}

const STATE_TEXT = {
  unchanged: "unchanged",
  downloaded: "downloaded",
  saved: "saved into the folder",
  modified: "modified, not saved",
  new: "new, not saved",
  absent: "not in this folder",
};

/** Whether any file has changes that are not saved. */
const unsaved = () => Object.values(fileStates()).some((s) => s === "modified" || s === "new");

/** Whether the folder holds a file: one that the page's data lists as missing does not. */
const isHeld = (kind) => !(kind in DATA.files) || Boolean(DATA.files[kind]);

/** Note a file that the page starts, such as a power system added to a scenario folder. */
function fileAdded(kind) {
  if (!sources[kind]) sources[kind] = { how: "new" };
}

/** A file's name in the folder, by its kind. */
function fileName(kind) {
  const file = projectFiles().find((f) => f.kind === kind);
  return file ? file.path : project.names[kind] || kind;
}

/** Where a file came from, in words. */
function sourceText(kind) {
  const source = sources[kind];
  if (!source) return "";
  return {
    page: `from ${source.folder}/, when the page was written`,
    folder: `opened from the folder ${source.folder}/`,
    file: "opened alone: the browser does not tell the page its folder",
    new: "started on this page",
  }[source.how];
}

/** Save one file, as a download, and note it as saved. */
function downloadFile(kind) {
  const file = projectFiles().find((f) => f.kind === kind);
  if (!file) return;
  download(file);
  markSaved([kind], "download");
  refreshFiles();
}

function downloadButton(kind) {
  return el("button", { class: "btn small", text: "download", title: "Save this file, as a download", "data-download": kind, onclick: () => downloadFile(kind) });
}

/** A tab's bar for one of its files: its name, where it came from, its state, and Open and download. */
function fileBar(kind) {
  const bar = el("div", { class: "file-bar", title: OPENERS[kind] ? `Drop a file here, in place of ${project.names[kind]}` : null },
    el("b", { class: "file-name", text: fileName(kind) }),
    el("span", { class: "hint", text: sourceText(kind) }),
    el("span", { class: "file-state", "data-state": kind }),
    el("span", { class: "spacer" }),
    OPENERS[kind] ? openButton(kind) : null,
    downloadButton(kind));
  return OPENERS[kind] ? dropTarget(bar, kind) : bar;
}

/** The page's problems in a file's sections: [errors, notes]. */
function problemsOf(kind) {
  const mine = state.problems.filter((p) => SECTIONS[p.section] && SECTIONS[p.section].file === kind);
  return [mine.filter((p) => p.level === "error").length, mine.filter((p) => p.level === "note").length];
}

/** The full check of a file: what quicksat's loaders said when Python wrote the page. */
function fullCheck(tag, kind) {
  const name = fileName(kind);
  const check = DATA.checks.find((c) => c.file.split(" with ").includes(name));
  if (!check) return el(tag, { class: "hint", text: "—" });
  if (check.ok === null) return el(tag, { class: "hint", text: "not run", title: "Opened after Python wrote the page. Write the page again for the full check." });
  return check.ok ? el(tag, { class: "ok", text: "pass", title: `quicksat reads ${check.file}` }) : el(tag, { class: "bad", text: "refused", title: check.message });
}

/**
 * A table of the folder's files, for opening them: for each, where it came
 * from, whether it changed, its simple and full checks, and its buttons. `groups` are the rows, each group under an optional heading:
 * [{head, rows: [{kind, add}]}], where `add` starts a missing file.
 */
function filesTable(groups) {
  const table = el("table", { class: "items files-table" });
  table.append(el("tr", {}, ["file", "from", "state", "simple check", "full check", ""].map((h) => el("th", { text: h }))));
  for (const group of groups) {
    if (group.head) table.append(el("tr", { class: "group-row" }, el("td", { colspan: 6 }, group.head)));
    for (const { kind, add } of group.rows) {
      table.append(el("tr", {},
        el("td", {}, el("b", { text: fileName(kind) })),
        el("td", { class: "hint", text: sourceText(kind) }),
        el("td", { class: "file-state", "data-state": kind }),
        el("td", { "data-checks": kind }),
        fullCheck("td", kind),
        el("td", { class: "tools" },
          OPENERS[kind] ? openButton(kind) : null, " ",
          add ? el("button", { class: "btn small", text: "add", "data-add": kind, title: "Start this file on the page", onclick: add }) : null)));
    }
  }
  return el("div", { class: "scroll-x" }, table);
}

/** Show each file's state, its page checks, and which buttons apply, wherever the page shows them. */
function refreshFiles() {
  const states = fileStates();
  for (const node of document.querySelectorAll("[data-state]")) {
    const fileState = states[node.dataset.state] || "absent";
    node.textContent = STATE_TEXT[fileState];
    node.dataset.value = fileState;
  }
  for (const button of document.querySelectorAll("[data-download]")) button.disabled = states[button.dataset.download] === "absent";
  for (const button of document.querySelectorAll("[data-add]")) button.hidden = states[button.dataset.add] !== "absent";
  for (const cell of document.querySelectorAll("[data-checks]")) {
    const [errors, notes] = problemsOf(cell.dataset.checks);
    // a file with no fields of its own, such as the 3D model, has no checks of its own
    const absent = states[cell.dataset.checks] === "absent" || !Object.values(SECTIONS).some((section) => section.file === cell.dataset.checks);
    cell.className = absent ? "hint" : errors ? "bad" : notes ? "warn" : "ok";
    cell.textContent = absent ? "—" : errors ? `${errors} problem${errors > 1 ? "s" : ""}` : notes ? `${notes} note${notes > 1 ? "s" : ""}` : "pass";
  }
}

// ---------------------------------------------------------------- opening files

/**
 * Open a folder, or one file, in place of what the page holds. An opener picks
 * the files, reads them into `DATA` and the project, and returns the kinds of
 * the files it replaced. quicksat's loaders have not read them, so their checks
 * are marked as not run.
 */
async function openWith(kind, dropped = null) {
  const opener = OPENERS[kind];
  const what = kind === "folder" ? "a folder replaces every file" : `a file replaces ${project.names[kind] || "it"}`;
  if (unsaved() && !confirm(`Opening ${what} on this page. The changes you have not saved are lost.`)) return;
  const picked = dropped || (await pickFiles(opener.pick));
  if (!picked.files.length) return;
  const before = Object.fromEntries(Object.entries(DATA.files).map(([k, file]) => [k, file ? file.name : ""]));
  let kinds;
  try {
    kinds = await opener.open(picked);
  } catch (error) {
    alert(error.message);
    return;
  }
  if (!kinds) return;
  const names = (k) => [before[k], DATA.files[k] && DATA.files[k].name].filter(Boolean);
  DATA.checks = DATA.checks.filter((check) => !kinds.some((k) => names(k).some((name) => check.file.split(" with ").includes(name))));
  for (const k of kinds) if (DATA.files[k]) DATA.checks.push({ file: DATA.files[k].name, ok: null, message: "" });
  reviewFiles(kinds.filter((k) => YAML_KINDS.includes(k)));
  if (kind === "folder") {
    for (const k of Object.keys(sources)) delete sources[k];
    for (const k of Object.keys(savedText)) delete savedText[k];
    const held = Object.keys(currentTexts()).filter(isHeld);
    // a folder's files dropped loose come without their folder's name
    for (const k of held) sources[k] = picked.folder ? { how: "folder", folder: picked.folder } : { how: "file" };
    for (const k of Object.keys(currentTexts())) fileAdded(k);
    markSaved(held);
  } else {
    for (const k of kinds) sources[k] = { how: "file" };
    markSaved(kinds);
  }
  state.pendingDelete = null;
  showLabel();
  updateBanner();
  drawView();
  runChecks();
  page.afterChange();
}

/** The area that opens a folder in place of the page's files: its button, or a drop. */
function openFolderButton() {
  return dropTarget(el("div", { class: "open-row drop-area" },
    el("button", { class: "btn primary", text: "Open a folder…", onclick: () => openWith("folder") }),
    el("span", { class: "hint" }, OPENERS.folder.hint, el("br"), "Or drop the folder here, or its files.")), null);
}

// ---------------------------------------------------------------- dropping files

/**
 * The kind of file a name belongs to, if exactly one of the page's files has it,
 * or a kind the page's own `kindOfFile` gives it.
 */
function kindOfName(name) {
  const kinds = Object.keys(project.names).filter((kind) => OPENERS[kind] && project.names[kind] === name);
  if (kinds.length === 1) return kinds[0];
  return page.kindOfFile(name);
}

/**
 * Open what was dropped. A folder, or several files, open as a folder. One file
 * opens as the kind it was dropped on, or as the page's file of the same name.
 */
async function openDropped(transfer, kind) {
  let dropped;
  try {
    dropped = await droppedFiles(transfer);
  } catch (error) {
    alert(error.message);
    return;
  }
  if (!dropped.files.length) return;
  if (kind && dropped.isFolder) {
    alert(`Drop a file here, in place of ${project.names[kind]}. A folder goes on the first Setup step.`);
    return;
  }
  const single = dropped.files.length === 1 ? kindOfName(dropped.files[0].path) : null;
  const target = kind || (dropped.isFolder || dropped.files.length > 1 ? "folder" : single);
  if (!target) {
    alert(`${dropped.files[0].path} is not one of this page's files by its name. Drop it on its tab's bar, or drop the whole folder.`);
    return;
  }
  await openWith(target, dropped);
}

/** Let an element take drops, for a kind of file, or for the folder when kind is null. */
function dropTarget(node, kind) {
  node.addEventListener("dragover", (event) => {
    event.preventDefault();
    event.stopPropagation();
    node.classList.add("drag-over");
  });
  node.addEventListener("dragleave", (event) => {
    if (!node.contains(event.relatedTarget)) node.classList.remove("drag-over");
  });
  node.addEventListener("drop", (event) => {
    event.preventDefault();
    event.stopPropagation();
    node.classList.remove("drag-over");
    openDropped(event.dataTransfer, kind);
  });
  return node;
}

// A drop anywhere else on the page is read as a drop on the first Setup step, so
// that the browser never leaves the page to show the dropped file
document.addEventListener("dragover", (event) => event.preventDefault());
document.addEventListener("drop", (event) => {
  event.preventDefault();
  openDropped(event.dataTransfer, null);
});

/** The button that opens one file, of a kind, in place of the page's. */
function openButton(kind) {
  const opener = OPENERS[kind];
  return el("button", {
    class: "btn small", text: `Open ${opener.label}…`,
    title: `Open a file in place of ${project.names[kind] || opener.label}. ${opener.hint || ""}`.trim(),
    onclick: () => openWith(kind),
  });
}

/** The folder's name in the header and the page's title. */
function showLabel() {
  document.title = `${PAGE_TITLE} · ${DATA.label || project.name}`;
  $("#folder").textContent = DATA.label || project.name;
}

// ---------------------------------------------------------------- start

/** Start the page, once the page's own parts are ready. */
function startPage() {
  $("#checks-chip").addEventListener("click", () => {
    const pop = $("#popover");
    if (!pop.hidden && pop.dataset.kind === "checks") pop.hidden = true;
    else showChecksPopover();
  });
  document.addEventListener("keydown", (e) => e.key === "Escape" && ($("#popover").hidden = true));
  reviewFiles(YAML_KINDS);
  // a file the folder does not hold starts on the page, as new
  const held = Object.keys(currentTexts()).filter(isHeld);
  for (const kind of held) sources[kind] = { how: "page", folder: DATA.label || DATA.folder };
  for (const kind of Object.keys(currentTexts())) fileAdded(kind);
  markSaved(held);
  showLabel();
  showTab("setup");
  showStep(0);
  updateBanner();
}

// quicksat sizing editor: the project, read from the folder's files, the names
// and their uses, and the figures worked out from the fields.
//
// Python passes the files as YAML reads them when it writes the page, and
// open.js reads them the same way when the user opens a folder or a file. So
// this part only turns them into the page's fields. What it cannot keep, it
// notes, so that the page can say so before the user saves.

// ---------------------------------------------------------------- reading the files

const NUMBER_UNIT = /^([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*(.*)$/;

/** A number and its unit, from a number or text such as `500 km`; null if neither. */
function numberUnit(value) {
  if (typeof value === "number") return { v: value, u: "" };
  const match = String(value ?? "").trim().match(NUMBER_UNIT);
  return match ? { v: Number(match[1]), u: match[2].trim() } : null;
}

/** A quantity, with `unit` where the file gives none. */
function readQ(value, unit, where) {
  if (value == null || value === "") return q("", unit);
  const parsed = numberUnit(value);
  if (!parsed) { notice("changed", `${where}: "${value}" is not a number, and was left empty`); return q("", unit); }
  return q(parsed.v, parsed.u || unit);
}

/** A plain number, or "" when the field is empty or not a number. */
function readNum(value, where, fallback = "") {
  if (value == null || value === "") return fallback;
  const parsed = numberUnit(value);
  if (!parsed || parsed.u) { notice("changed", `${where}: "${value}" is not a plain number, and was left empty`); return ""; }
  return parsed.v;
}

/** A fraction, shown in percent: `5 %` or `0.05` both give 5 %. */
function readPercent(value, where, fallback = "") {
  if (value == null || value === "") return q(fallback, "%");
  const parsed = numberUnit(value);
  if (!parsed) { notice("changed", `${where}: "${value}" is not a number, and was left empty`); return q("", "%"); }
  if (parsed.u === "%" || parsed.u === "percent") return q(parsed.v, "%");
  if (!parsed.u) {
    notice("changed", `${where}: ${value} is read as ${Number((parsed.v * 100).toPrecision(12))} %`);
    return q(Number((parsed.v * 100).toPrecision(12)), "%");
  }
  notice("changed", `${where}: "${value}" is not a fraction, and was left empty`);
  return q("", "%");
}

function readBool(value, fallback) {
  if (typeof value === "boolean") return value;
  const text = String(value ?? "").trim().toLowerCase();
  if (["true", "yes", "1"].includes(text)) return true;
  if (["false", "no", "0"].includes(text)) return false;
  return fallback;
}

const mapOf = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value : {});
const textOf = (value) => (typeof value === "string" ? value : "");

/** Note the keys that the editor does not know, which saving would leave out. */
function known(where, obj, keys) {
  for (const key of Object.keys(obj)) {
    if (key !== RESERVED && !keys.includes(key)) notice("unknown", `${where} › ${key}`);
  }
}

const NAMES = {
  mission: "mission.yaml",
  mass: "mass_budget_config.yaml",
  equipment: "equipment.csv",
  data: "pl_dataflow_model.yaml",
  deltav: "delta_v_config.yaml",
  manoeuvres: "manoeuvres.csv",
  agility: "agility_config.yaml",
};

const MASS_CLASSES = ["equipment", "propellant"];
const LAUNCHER = "Launcher";
const MANOEUVRE_TYPES = ["altitude_change", "collision_avoidance", "inclination_change", "deorbit", "given"];
const VALUE_UNITS = {
  altitude_change: ["km", "m"],
  collision_avoidance: ["m", "km"],
  inclination_change: ["deg"],
  deorbit: ["km", "m"],
  given: ["m/s"],
};
const EQUIPMENT_COLUMNS = ["equipment_id", "equipment_name", "location", "responsibility", "subsystem", "unit_mass", "eqpt_margin", "number_of_units", "mass_class", "comments"];
const MANOEUVRE_COLUMNS = ["manoeuvre_id", "manoeuvre_name", "phase", "manoeuvre_type", "value", "count", "recurring", "loss_factor", "comments"];

/** A CSV file's rows as objects, keyed by the header, noting any column the editor does not know. */
function csvRecords(file, columns) {
  if (!file) return [];
  for (const name of file.header) if (!columns.includes(name)) notice("unknown", `${file.name} › column ${name}`);
  return file.rows.map((cells) => Object.fromEntries(file.header.map((name, i) => [name, cells[i] ?? ""])));
}

function readMission(file) {
  const m = mapOf(file && file.data);
  known(NAMES.mission, m, ["altitude", "inclination", "duration"]);
  return {
    altitude: readQ(m.altitude, "km", "altitude"),

function readMass(file) {
  if (!file) {
    return { comments: "", locations: { comments: "", items: [
      { name: "Platform", system_margin: 20, harness_fraction: 5, harness_margin: 25, retained_in_orbit: true, comments: "" },
      { name: "Payload", system_margin: 20, harness_fraction: 5, harness_margin: 25, retained_in_orbit: true, comments: "" },
    ] } };
  }
  const m = mapOf(file.data);
  known(file.name, m, ["locations"]);
  const locations = mapOf(m.locations);
  return {
    comments: textOf(m.comments),
    locations: {
      comments: textOf(locations.comments),
      items: Object.entries(locations).filter(([name]) => name !== RESERVED).map(([name, value]) => {
        const l = mapOf(value);
        const where = `locations › ${name}`;
        known(`${file.name} › ${where}`, l, ["system_margin", "harness_fraction", "harness_margin", "retained_in_orbit"]);
        return {
          name,
          system_margin: readNum(l.system_margin, where, 0),
          harness_fraction: readNum(l.harness_fraction, where, 0),
          harness_margin: readNum(l.harness_margin, where, 0),
          retained_in_orbit: readBool(l.retained_in_orbit, true),
          comments: textOf(l.comments),
        };
      }),
    },
  };
}

function readEquipment(file) {
  return csvRecords(file, EQUIPMENT_COLUMNS).map((r, i) => ({
    id: r.equipment_id.trim(),
    name: r.equipment_name,
    location: r.location.trim(),
    responsibility: r.responsibility.trim(),
    subsystem: r.subsystem.trim(),
    unit_mass: readQ(r.unit_mass, "kg", `equipment row ${i + 2}`),
    margin: readNum(r.eqpt_margin, `equipment row ${i + 2}`),
    units: readNum(r.number_of_units, `equipment row ${i + 2}`),
    mass_class: (r.mass_class || "").trim().toLowerCase() || "equipment",
    comments: r.comments || "",
  }));
}

function readData(file) {
  const m = mapOf(file && file.data);
  if (file) known(file.name, m, ["generation", "downlink", "storage"]);
  const g = mapOf(m.generation), d = mapOf(m.downlink), s = mapOf(m.storage);
  if (file) {
    known(`${file.name} › generation`, g, ["raw_datarate", "compression_ratio", "duty_cycle"]);
    known(`${file.name} › downlink`, d, ["rate", "contacts_per_day", "avg_contact_duration"]);
    known(`${file.name} › storage`, s, ["orbits_without_contact"]);
  }
  return {
    comments: textOf(m.comments),
    generation: {
      raw_datarate: readQ(g.raw_datarate, "Mbit/s", "raw data rate"),
      compression_ratio: readNum(g.compression_ratio, "compression ratio", file ? "" : 1),
      duty_cycle: readPercent(g.duty_cycle, "duty cycle"),
      comments: textOf(g.comments),
    },
    downlink: {
      rate: readQ(d.rate, "Mbit/s", "downlink rate"),
      contacts_per_day: readNum(d.contacts_per_day, "contacts per day"),
      avg_contact_duration: readQ(d.avg_contact_duration, "min", "contact duration"),
      comments: textOf(d.comments),
    },
    storage: {
      orbits_without_contact: readNum(s.orbits_without_contact, "orbits without contact", file ? "" : 1),
      comments: textOf(s.comments),

function readDeltaV(file) {
  const m = mapOf(file && file.data);
  if (file) known(file.name, m, ["propulsion", "margin", "collision_avoidance"]);
  const p = mapOf(m.propulsion), c = mapOf(m.collision_avoidance);
  return {
    comments: textOf(m.comments),

function readManoeuvres(file) {
  return csvRecords(file, MANOEUVRE_COLUMNS).map((r, i) => {
