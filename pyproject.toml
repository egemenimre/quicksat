[build-system]
requires = ["flit_core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "quicksat"
# read from __version__ in quicksat/__init__.py, so it is written in one place
dynamic = ["version"]
dependencies = [
    "astropy",
    # static plots: the scenario's Gantt chart and ground track maps
    "matplotlib",
    "numpy",
    # output-formatting brings jinja2, which pandas Styler needs -- every report.py
    # returns one
    "pandas[output-formatting]",
    # time intervals: eclipses and activities are both portion intervals
    "portion",
    "pydantic>=2.0",
    "pyyaml",
    # rotations and quaternions: the attitudes and slews
    "scipy",
    # SGP4 propagation of a TLE
    "sgp4",
]

requires-python = ">=3.12"

authors = [{ name = "Egemen Imre" }]

description = "First-pass satellite sizing: mass, data, delta-V and agility budgets, a scenario on a real orbit, power and battery checks, a 3D viewer and file editors"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]

keywords = [
    "satellite",
    "systems engineering",
    "mass budget",
    "power budget",
    "spacecraft design",
    "delta-v",
    "attitude",
    "solar panels",
    "orbit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/egemenimre/quicksat/"
Repository = "https://github.com/egemenimre/quicksat/"
Documentation = "https://github.com/egemenimre/quicksat/tree/master/docs"
Changelog = "https://github.com/egemenimre/quicksat/blob/master/CHANGELOG.md"
Issues = "https://github.com/egemenimre/quicksat/issues"

[project.optional-dependencies]
test = ["pytest", "coverage", "pytest-xdist"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C", "I"]
ignore = ["E203", "E266", "E501"]

[tool.ruff.lint.per-file-ignores]
"sample/**/*.ipynb" = ["E402"]
"docs/**/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["quicksat"]

[tool.pyright]
# The quantity types in utils/parser_helpers are built by a factory, so they are
# function return values rather than statically visible aliases, and pyright will
# not accept one in a type expression. Nothing else here writes a type expression
# this rule would catch.
reportInvalidTypeForm = "none"

[tool.pytest.ini_options]

[tool.coverage.report]
omit = ["*/tests/*", "*/temp/*", "*__init__.py"]
exclude_lines = ["def __repr__", "def __str__", "pragma: no cover"]
