[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "quicksat"
version = "0.1.0"
dependencies = ["pandas", "pint", "pydantic>=2.0", "pyyaml"]

requires-python = ">=3.11"

authors = [{ name = "Egemen Imre" }]

description = "Basic satellite sizing tool: mass budget, power and battery sizing, delta-V"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

keywords = [
    "satellite",
    "systems engineering",
    "mass budget",
    "power budget",
    "spacecraft design",
    "delta-v",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/egemenimre/quicksat/"
Repository = "https://github.com/egemenimre/quicksat/"

[project.optional-dependencies]
test = ["pytest", "coverage", "pytest-xdist"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C", "I"]
ignore = ["E203", "E266", "E501"]

[tool.ruff.lint.per-file-ignores]
"sample/**/*.ipynb" = ["E402"]
"docs/**/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["quicksat"]

[tool.pyright]
# The quantity types in utils/parser_helpers are built by a factory, so they are
# function return values rather than statically visible aliases, and pyright will
# not accept one in a type expression. pint's own Quantity alias trips the same
# rule. Nothing else here writes a type expression this rule would catch.
reportInvalidTypeForm = "none"

[tool.pytest.ini_options]

[tool.coverage.report]
omit = ["*/tests/*", "*/temp/*", "*__init__.py"]
exclude_lines = ["def __repr__", "def __str__", "pragma: no cover"]
