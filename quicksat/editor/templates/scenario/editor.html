<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quicksat Scenario Editor</title>
<style>
/*@css@*/

/* The scenario editor's own parts: the place search, the activities, and the 3D panel */
main.with-3d { grid-template-columns: minmax(0, 1fr) minmax(320px, 38%); }

/* The search for places to add as targets */
.search { margin-bottom: 10px; }
.search-results { display: grid; gap: 2px; margin-top: 4px; max-width: 700px; }
.search-results button {
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
  padding: 3px 8px; color: var(--text); cursor: pointer;
}
.search-results button:hover { border-color: var(--accent); }
.search-results small { color: var(--muted); }

/* The satellites of a file just added, to choose from */
.drop-area + .target-choice { margin-top: 8px; }
.target-choice { border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px 12px; margin-bottom: 10px; }
.target-choice .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 14px; margin: 6px 0 10px; max-height: 260px; overflow: auto; }
.target-choice label { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.target-choice label.added { color: var(--muted); }
.target-choice small { color: var(--muted); }
.nowrap { white-space: nowrap; }

.items .trigger-text { color: var(--amber); white-space: nowrap; font-size: 11.5px; margin-top: 5px; }
/* Activities: the trigger's cell has two lines, so every cell aligns to the top and the
   controls of a row stay on one line, with the written trigger below them */
.items.activities tr:not(.note-row) > td { vertical-align: top; padding-top: 6px; }
.items.activities tr:not(.note-row) > td.num { padding-top: 10.5px; }
.items.activities tr:not(.note-row) > td.tools { padding-top: 8.5px; }

/* The viewer, made by the editor's server: in the Files tab and on the last Setup step */
.viewer-panel { display: grid; gap: 8px; max-width: 900px; min-width: 0; overflow-wrap: anywhere; }
.viewer-panel > * { min-width: 0; }
.viewer-panel .run-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.viewer-panel a.btn { text-decoration: none; }
.viewer-panel .hint { margin: 0; }
.viewer-panel pre.command { margin: 6px 0 8px; padding: 6px 8px; background: #050c18; border-radius: 3px; color: var(--amber); white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
.viewer-panel .run-result p { margin: 0 0 4px; }
.viewer-panel .run-result .ok { color: var(--green); }
.viewer-panel pre.report { margin: 6px 0 0; white-space: pre-wrap; font: inherit; font-size: 11px; color: var(--muted); max-height: 320px; overflow: auto; }
.viewer-panel .python-checks { margin-top: 0; }
.files-viewer { margin-top: 14px; }
.step-body h3.viewer-head { margin-top: 26px; }
.files-viewer .viewer-panel { gap: 6px; }
/* in the narrow file list, the link fills the column as the list's buttons do */
.files-viewer .run-row { display: grid; gap: 6px; }
.files-viewer a.btn { display: block; text-align: left; padding: 4px 8px; }

.vp-message { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 20px; text-align: center; }

/* The Activity Designer: with the editor's server, the run in a frame above the
   list of activities, and a divider to drag between them. The list scrolls on
   its own, so the run stays in view. */
#page-activities { grid-template-rows: minmax(0, 1fr); }
#page-activities .designer-frame, #page-activities .designer-divider { display: none; }
#page-activities.designing { grid-template-rows: var(--frame-height, 58%) 7px minmax(0, 1fr); }
#page-activities.designing .designer-frame { display: block; position: relative; min-height: 0; background: #08111f; }
#page-activities.designing .designer-divider {
  display: block; cursor: row-resize; background: var(--panel);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
#page-activities.designing .designer-divider:hover { background: var(--line-2); }
.designer-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.designer-frame.running iframe { opacity: 0.45; transition: opacity 0.2s; }
#page-activities.dragging iframe { pointer-events: none; }
.designer-bar { max-width: none; margin-bottom: 10px; }
.designer-bar .check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.designer-bar .run-status.ok, .designer-bar .saved.ok { color: var(--green); }
.designer-bar .run-status.warn { color: var(--amber); }
.designer-bar .run-status.bad, .designer-bar .saved.bad { color: var(--red); }
.designer-bar .period, .designer-bar .saved { margin: 0; }
.designer-bar .run-warnings p { margin: 0 0 4px; }
/* Under each title, what the last run made of the activity: a line for the count,
   and one for each warning or failure, labelled as such */
.items .run-text { font-size: 11px; margin-top: 5px; color: var(--muted); max-width: 340px; }
.items .run-text:empty { display: none; }
.items .run-text .run-warn { color: var(--amber); }
.items .run-text .run-fail { color: var(--red); }
.items .run-text b { font-weight: 600; }
.items .run-text.changed { color: var(--dim); font-style: italic; }

/* The 3D panel */
.panel3d { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; min-height: 0; min-width: 0; overflow: hidden; background: #0a1424; }
main:not(.with-3d) .panel3d { display: none; }
.panel3d-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.panel3d-head .title { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; color: var(--muted); }
.panel3d-head .title b { color: var(--text); font-weight: 600; }
.viewport { position: relative; background: #050c18; min-height: 0; overflow: hidden; }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.label3d { position: absolute; left: 0; top: 0; font-size: 10.5px; white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.readout {
  border-top: 1px solid var(--line); background: var(--panel);
  padding: 6px 10px; font-size: 11px; color: var(--muted); min-height: 44px;
}
.readout b { color: var(--text); font-weight: 400; }
.readout .bad { color: var(--red); }
.vtoggles { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.parts { border-top: 1px solid var(--line); max-height: 34%; overflow: auto; padding: 6px 10px 10px; }
.parts .k { color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; margin: 4px 0; }
.parts button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 4px;
  color: var(--muted); cursor: pointer; border-radius: 2px;
}
.parts button:hover { color: var(--text); }
.parts button.on { color: var(--accent); background: var(--accent-soft); }
.parts button small { color: var(--dim); }
.turn { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); }
.turn input { flex: 1; }
.turn[hidden] { display: none; }

@media (max-width: 900px) {
  main.with-3d { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 45%; }
  .panel3d { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">QUICKSAT<span>SCENARIO EDITOR</span></div>
  <div class="folder-name" id="folder" title="The folder of input files this page edits"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <button class="chip" id="checks-chip" title="The page's basic checks"></button>
  <button class="btn" id="toggle-3d">Show 3D</button>
</header>
<div class="banner" id="banner" hidden></div>
<main id="main" class="with-3d">
  <div class="pages" id="pages">
    <section class="page" id="page-setup">
      <nav class="steps" id="steps"></nav>
      <div class="step" id="step"></div>
    </section>
    <section class="page" id="page-orbit"><div class="sheet" id="sheet-orbit"></div></section>
    <section class="page" id="page-spacecraft"><div class="sheet" id="sheet-spacecraft"></div></section>
    <section class="page" id="page-targets"><div class="sheet" id="sheet-targets"></div></section>
    <section class="page" id="page-operations"><div class="sheet" id="sheet-operations"></div></section>
    <section class="page" id="page-activities">
      <div class="designer-frame" id="designer-frame"></div>
      <div class="designer-divider" id="designer-divider" title="Drag to share the height between the run and the list"></div>
      <div class="sheet" id="sheet-activities"></div>
    </section>
    <section class="page" id="page-power"><div class="sheet" id="sheet-power"></div></section>
    <section class="page" id="page-consumption"><div class="sheet" id="sheet-consumption"></div></section>
    <section class="page" id="page-files">
      <nav class="filelist" id="filelist"></nav>
      <div class="preview" id="preview"></div>
    </section>
  </div>
  <aside class="panel3d" id="panel3d">
    <div class="panel3d-head">
      <span class="title"><b>3D model</b> <span id="model-name"></span></span>
      <span class="spacer"></span>
      <label class="btn small" title="Load another GLB file">Load GLB<input type="file" id="glb-input" accept=".glb" hidden></label>
      <button class="btn small" id="hide-3d" title="Hide the 3D panel on this step or tab">Hide</button>
    </div>
    <div class="viewport" id="viewport">
      <canvas></canvas>
      <div class="labels" id="labels"></div>
      <div class="vtoggles" id="vtoggles"></div>
    </div>
    <div class="readout" id="readout"></div>
    <div class="turn" id="turn" hidden>
      <span id="turn-label">turn</span>
      <input type="range" id="turn-range" min="-180" max="180" step="1" value="0">
      <span id="turn-value">0°</span>
    </div>
    <div class="parts" id="parts"></div>
  </aside>
</main>
<div class="popover" id="popover" hidden></div>
<script id="help" type="application/json">@help@</script>
<script id="project" type="application/json">@project@</script>
<script>/*@three@*/</script>
<script>/*@yaml@*/</script>
<script>/*@editor@*/</script>
</body>
</html>
