#
# The help for the payload's thermal file, which sits in the power folder, and
# for the Thermal tab's heat account.
#
# Each key is a step of the editor, a key of the file, or both:
#
#   title  the heading of the step's information box
#   info   the information box, in HTML. {{files}} stands for the shared help on
#          the table of files.
#   file   the help that the editor writes above the key, as # lines, when it
#          saves the file
#
# The editor's page holds these files, so that the page and the files it saves
# read the same text. The reference notebooks give the full explanation.

surfaces:
  title: Surfaces
  info: |-
    <p>The payload's surfaces that absorb and radiate heat: its radiators, and an aperture if it has one. A surface names a flat part of the 3D model, as a solar panel does, or is typed in with a normal and an area. A surface on a wing turns with it. With the self-shadowing on, the rest of the model shades the sun on it.</p>
    <span class="k">Properties</span>
    <p><b>Absorptance</b> is the share of sunlight it absorbs, such as 0.20 for white paint. Set it for the year being sized: white paint rises to 0.40 or more over a mission. <b>Emissivity</b> is the share of a black body's infrared it emits, such as 0.85. It also absorbs that share of the Earth's infrared.</p>
    <p><b>Temperature</b> is the design temperature, which the surface radiates at through the run. Give it in kelvin, such as 273 K. A temperature in Celsius in the file is turned into kelvin, but kelvin is preferred: astropy reads °C as a unit with an offset, and some ways of writing it do not read.</p>
    <p><b>Fixed:</b> something else holds the surface at its temperature, such as a telescope's own heaters. A floating surface moves with the equilibrium ΔT.</p>
    <span class="k">An aperture</span>
    <p>The aperture is the opening at the front of the telescope, not the mirror: the front of its baffle, or an opening in the bus's face with a vaned tube behind it. It takes in and gives out heat over the whole hemisphere in front of it, as a flat plate does. Its absorptance and emissivity are the tube's, about 0.9 or more for a blackened tube, not the mirror coating's.</p>
    <p>Its temperature is the mean of what shows through the opening, such as the vanes and the secondary mirror. The vanes see space and run cold, so the mean lies below the telescope's own temperature.</p>
  file: >-
    The surfaces that absorb and radiate heat. Each names a flat part of the 3D model, or gives a normal and an area. absorptance is the share of sunlight it absorbs, emissivity the share of a black body's infrared it emits. temperature is its design temperature, in kelvin. fixed_temperature: true when something else holds it there.

heat_flows:
  title: Heat flows
  info: |-
    <p>The powers that cross the payload's boundary elsewhere than a surface, such as the conduction through its mounts to the platform. Each is positive into the payload, so -3 W means 3 W leave it.</p>
    <span class="k">Options</span>
    <p><b>For every mode:</b> one power. <b>For each mode:</b> a power in each payload mode, 0 W included, such as the radio output of a transmitter that dissipates all its power inside the payload. The Modes step renames these modes, and a new mode gets an empty cell to fill.</p>
  file: >-
    The powers that cross the payload's boundary elsewhere than a surface, positive into the payload. Each is one power, or a power for each payload mode.

earth:
  title: The Earth
  info: |-
    <p>The <b>albedo</b> is the share of sunlight that the Earth reflects, and the <b>infrared</b> is its own flux. Both are averaged over the globe: 0.30 and 237 W/m² if left out.</p>
    <span class="k">Consequences</span>
    <p>A surface absorbs both as far as it sees the Earth, by its view factor. The albedo falls to zero over the night side. The infrared does not depend on the sun, so a surface facing the Earth absorbs it in eclipse too.</p>
  file: >-
    The Earth's albedo, the share of sunlight it reflects, and its infrared flux, averaged over the globe.

thermal_account:
  title: Heat account
  info: |-
    <p>Work out runs the files on this page on the editor's server, and sums the payload's heat over the run. Every term is a mean power, positive into the payload: the dissipation, the heaters, the heat flows, the sun, the albedo and the Earth's infrared on the surfaces, and their emission.</p>
    <span class="k">By payload mode</span>
    <p>The heaters are set per payload mode, so this table sets them. A mode's heater power goes in the heater row of the payload's consumption table. Its <b>balancing heater power</b> brings the mode's net energy over the run to zero, and is never below zero, since a heater cannot cool. <b>Balance</b> sets each mode's heater to it. A mode with a surplus even with no heater shows a radiator that is too small for it on its own.</p>
    <span class="k">Sizing decisions</span>
    <p>Balance is one way to set the heaters. Another runs the heater in the cold modes only, at the power that brings the run's net energy to zero, and lets the hot modes warm up a little. Which way to take, and how large the radiator is, are your decisions: the code cannot take them. A colder design, with a larger radiator, keeps the hot modes closer to balance, for more heater power.</p>
    <span class="k">By activity</span>
    <p>Two activities in one mode can differ: only a sunlit one sees the sun on its radiators. So this table shows where the heat builds up. Each activity counts the slew into it.</p>
    <span class="k">The equilibrium ΔT</span>
    <p>How far the floating surfaces would move from their design temperatures, all by one ΔT, if the activity or the mode went on forever. A fixed surface keeps its temperature. There is none when every surface is fixed, or when more heat leaves than comes in.</p>
    <span class="k">Between work-outs</span>
    <p>The server keeps the run and the surfaces' heat. So a change to the heaters, the flows or the dissipation is worked out again quickly, a moment after it, while this tab is open.</p>
